 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MAFIA</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Exo+2:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
/* ════════════════════════════════
   DESIGN TOKENS
════════════════════════════════ */
:root {
  --bg:         #04060a;
  --bg2:        #080c12;
  --surface:    #0c1118;
  --surface2:   #111820;
  --surface3:   #161e28;
  --border:     rgba(255,255,255,.06);
  --border2:    rgba(255,255,255,.11);
  --border3:    rgba(255,255,255,.18);
  --red:        #ff2244;
  --red-dim:    rgba(255,34,68,.15);
  --amber:      #ffaa00;
  --amber-dim:  rgba(255,170,0,.15);
  --teal:       #00e5cc;
  --teal-dim:   rgba(0,229,204,.12);
  --blue:       #4488ff;
  --blue-dim:   rgba(68,136,255,.12);
  --green:      #00e676;
  --green-dim:  rgba(0,230,118,.12);
  --purple:     #bb88ff;
  --purple-dim: rgba(187,136,255,.12);
  --gold:       #ffd700;
  --text:       #dce4f0;
  --text2:      #8899b0;
  --text3:      #445566;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

/* ════════════════════════════════
   RESET + BASE
════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { height:100%; }
body {
  min-height:100%; background:var(--bg);
  color:var(--text); font-family:'Exo 2',sans-serif;
  font-size:15px; line-height:1.5; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  padding-top:var(--safe-top);
}

/* ════════════════════════════════
   ANIMATED BACKGROUND
════════════════════════════════ */
#bg-scene {
  position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
}
#bg-grid {
  position:absolute; inset:-50%;
  width:200%; height:200%;
  background-image:
    linear-gradient(rgba(0,229,204,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,204,.018) 1px, transparent 1px);
  background-size:60px 60px;
  animation:gridDrift 40s linear infinite;
}
@keyframes gridDrift { to { transform:translate(60px,60px); } }
#bg-glow1 {
  position:absolute; width:600px; height:600px;
  top:-200px; left:-100px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,34,68,.07) 0%, transparent 70%);
  animation:glow1Float 12s ease-in-out infinite;
}
#bg-glow2 {
  position:absolute; width:500px; height:500px;
  bottom:-150px; right:-100px; border-radius:50%;
  background:radial-gradient(circle, rgba(0,229,204,.06) 0%, transparent 70%);
  animation:glow2Float 15s ease-in-out infinite;
}
#bg-glow3 {
  position:absolute; width:400px; height:400px;
  top:40%; left:50%; transform:translate(-50%,-50%); border-radius:50%;
  background:radial-gradient(circle, rgba(68,136,255,.04) 0%, transparent 70%);
  animation:glow3Float 18s ease-in-out infinite;
}
@keyframes glow1Float { 0%,100%{transform:translate(0,0) scale(1);} 50%{transform:translate(40px,30px) scale(1.1);} }
@keyframes glow2Float { 0%,100%{transform:translate(0,0);} 50%{transform:translate(-30px,-40px) scale(1.08);} }
@keyframes glow3Float { 0%,100%{transform:translate(-50%,-50%) scale(1);} 50%{transform:translate(-50%,-50%) scale(1.15);} }
#bg-vignette {
  position:absolute; inset:0;
  background:radial-gradient(ellipse at center, transparent 0%, rgba(4,6,10,.85) 75%);
}
#pt-canvas { position:absolute; inset:0; }

/* ════════════════════════════════
   LAYOUT
════════════════════════════════ */
#curtain { position:fixed; inset:0; background:var(--bg); z-index:9998; pointer-events:none; opacity:0; transition:opacity .3s; }
#curtain.show { opacity:1; }
#app {
  position:relative; z-index:2;
  min-height:100vh; min-height:100dvh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  padding:12px 12px calc(12px + var(--safe-bot));
}

/* ════════════════════════════════
   CARD / PANEL
════════════════════════════════ */
.card {
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:16px;
  padding:24px 20px;
  width:100%; max-width:460px;
  position:relative; overflow:hidden;
  box-shadow:
    0 0 0 1px var(--border),
    0 20px 60px rgba(0,0,0,.7),
    0 0 80px rgba(0,229,204,.04);
  margin: auto;
}
.card-glow-red   { box-shadow:0 0 0 1px rgba(255,34,68,.2), 0 20px 60px rgba(0,0,0,.7), 0 0 60px rgba(255,34,68,.08); }
.card-glow-teal  { box-shadow:0 0 0 1px rgba(0,229,204,.2), 0 20px 60px rgba(0,0,0,.7), 0 0 60px rgba(0,229,204,.08); }
.card-glow-amber { box-shadow:0 0 0 1px rgba(255,170,0,.2), 0 20px 60px rgba(0,0,0,.7), 0 0 60px rgba(255,170,0,.08); }
.card-glow-gold  { box-shadow:0 0 0 1px rgba(255,215,0,.25), 0 20px 60px rgba(0,0,0,.7), 0 0 80px rgba(255,215,0,.1); }

.card::before {
  content:''; position:absolute; top:0; left:0; right:0; height:1px;
  background:linear-gradient(90deg, transparent 0%, var(--teal) 50%, transparent 100%);
  opacity:.6;
}

/* ════════════════════════════════
   WELCOME SCREEN
════════════════════════════════ */
.welcome-wrap {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh; width:100%; padding:16px;
  position:relative;
}
.welcome-card {
  width:100%; max-width:420px;
  background:var(--surface); border:1px solid var(--border2); border-radius:20px;
  overflow:hidden; position:relative;
  box-shadow:0 0 0 1px var(--border), 0 32px 80px rgba(0,0,0,.8), 0 0 120px rgba(255,34,68,.06);
}
.hero-band {
  padding:40px 28px 32px; text-align:center; position:relative;
  background:linear-gradient(180deg, rgba(255,34,68,.08) 0%, transparent 100%);
}
.hero-band::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, transparent, var(--red), var(--amber), var(--red), transparent);
  animation:borderFlame 3s ease-in-out infinite;
}
@keyframes borderFlame {
  0%,100% { opacity:.5; background-position:0% 50%; }
  50%     { opacity:1;  background-position:100% 50%; }
}
.hero-eyebrow {
  font-family:'Fira Code',monospace; font-size:10px; letter-spacing:4px;
  color:var(--red); text-transform:uppercase; margin-bottom:14px;
  opacity:.8;
}
.hero-title {
  font-family:'Black Ops One',cursive;
  font-size:clamp(68px,20vw,96px);
  letter-spacing:6px; line-height:.9;
  background:linear-gradient(160deg, #fff 0%, #ffcccc 30%, var(--red) 60%, #aa0011 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  filter:drop-shadow(0 0 30px rgba(255,34,68,.5)) drop-shadow(0 4px 0 rgba(0,0,0,.5));
  position:relative;
}
.hero-tagline {
  font-family:'Exo 2',sans-serif; font-size:12px; letter-spacing:3px;
  color:var(--text2); text-transform:uppercase; margin-top:12px;
}
.hero-badges {
  display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:20px;
}
.hero-badge {
  padding:4px 12px; border-radius:20px; font-family:'Fira Code',monospace;
  font-size:10px; letter-spacing:1px; border:1px solid; white-space:nowrap;
}
.badge-red   { border-color:rgba(255,34,68,.4);  color:#ff8899; background:rgba(255,34,68,.08); }
.badge-teal  { border-color:rgba(0,229,204,.3);  color:var(--teal); background:var(--teal-dim); }
.badge-amber { border-color:rgba(255,170,0,.35); color:var(--amber); background:var(--amber-dim); }
.badge-gold  { border-color:rgba(255,215,0,.35); color:var(--gold); background:rgba(255,215,0,.08); }
.hero-body { padding:0 28px 32px; }
.hero-desc {
  font-size:14px; color:var(--text2); line-height:1.7; margin-bottom:24px;
  text-align:center;
}

/* ════════════════════════════════
   TYPOGRAPHY
════════════════════════════════ */
.t-head {
  font-family:'Black Ops One',cursive; font-size:clamp(22px,6vw,30px);
  letter-spacing:3px; text-align:center; margin-bottom:4px;
  background:linear-gradient(135deg, #fff 0%, var(--text2) 100%);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.t-sub {
  font-family:'Fira Code',monospace; font-size:10px; letter-spacing:4px;
  color:var(--text3); text-transform:uppercase; text-align:center; margin-bottom:20px;
}
.t-label {
  font-family:'Fira Code',monospace; font-size:10px; letter-spacing:3px;
  color:var(--text3); text-transform:uppercase; margin-bottom:8px; display:block;
}
.t-lede {
  font-size:14px; color:var(--text2); line-height:1.65; text-align:center;
}

/* ════════════════════════════════
   BUTTONS
════════════════════════════════ */
.btn {
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; padding:15px 20px; border:none; border-radius:10px;
  font-family:'Black Ops One',cursive; font-size:17px; letter-spacing:3px;
  cursor:pointer; transition:all .2s; margin-bottom:10px;
  position:relative; overflow:hidden; user-select:none;
  -webkit-user-select:none; touch-action:manipulation;
}
.btn::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,.12) 0%, transparent 60%);
  opacity:0; transition:opacity .2s;
}
.btn:hover:not(:disabled)::after { opacity:1; }
.btn:active:not(:disabled) { transform:scale(.98); }
.btn:disabled { opacity:.3; cursor:not-allowed; }

.btn-red    { background:linear-gradient(135deg,#cc0022,#880011); color:#fff; box-shadow:0 4px 20px rgba(255,34,68,.25); }
.btn-red:hover:not(:disabled)    { box-shadow:0 8px 32px rgba(255,34,68,.45); transform:translateY(-1px); }
.btn-teal   { background:linear-gradient(135deg,#00bba8,#007a6e); color:#000; box-shadow:0 4px 20px rgba(0,229,204,.2); }
.btn-teal:hover:not(:disabled)   { box-shadow:0 8px 32px rgba(0,229,204,.4); transform:translateY(-1px); }
.btn-amber  { background:linear-gradient(135deg,#cc8800,#885500); color:#fff; box-shadow:0 4px 20px rgba(255,170,0,.2); }
.btn-amber:hover:not(:disabled)  { box-shadow:0 8px 32px rgba(255,170,0,.4); transform:translateY(-1px); }
.btn-ghost  { background:var(--surface2); border:1px solid var(--border2); color:var(--text2); font-family:'Exo 2',sans-serif; font-weight:600; font-size:14px; letter-spacing:1px; }
.btn-ghost:hover:not(:disabled)  { border-color:var(--border3); color:var(--text); background:var(--surface3); }
.btn-gold   { background:linear-gradient(135deg,#b8860b,#7a5800); color:#fff; box-shadow:0 4px 20px rgba(255,215,0,.2); }
.btn-gold:hover:not(:disabled)   { box-shadow:0 8px 32px rgba(255,215,0,.4); transform:translateY(-1px); }
.btn-sm { padding:9px 16px; font-size:13px; letter-spacing:2px; width:auto; margin-bottom:0; }

/* ════════════════════════════════
   INPUTS
════════════════════════════════ */
.field { margin-bottom:16px; }
input[type=text] {
  width:100%; background:var(--surface2);
  border:1px solid var(--border2); border-radius:10px;
  color:var(--text); font-family:'Exo 2',sans-serif;
  font-size:17px; font-weight:600; padding:13px 16px;
  outline:none; transition:all .2s; letter-spacing:.5px;
  -webkit-appearance:none; appearance:none;
}
input[type=text]:focus {
  border-color:var(--teal); box-shadow:0 0 0 3px rgba(0,229,204,.1);
  background:var(--surface3);
}
input.code-inp {
  text-align:center; font-family:'Black Ops One',cursive;
  font-size:34px; letter-spacing:14px; padding:16px 20px;
}
input::placeholder { color:var(--text3); }

/* ════════════════════════════════
   DIVIDER
════════════════════════════════ */
.divider {
  display:flex; align-items:center; gap:10px; margin:14px 0;
  font-family:'Fira Code',monospace; font-size:10px; letter-spacing:3px;
  color:var(--text3); text-transform:uppercase;
}
.divider::before,.divider::after { content:''; flex:1; height:1px; background:var(--border); }

/* ════════════════════════════════
   ALERTS
════════════════════════════════ */
.alert {
  padding:11px 14px; border-radius:8px; margin-bottom:12px;
  font-size:13px; line-height:1.5; font-family:'Fira Code',monospace;
  letter-spacing:.3px; border:1px solid;
}
.alert-err    { background:rgba(255,34,68,.1);   border-color:rgba(255,34,68,.3);   color:#ff8899; }
.alert-info   { background:var(--teal-dim);      border-color:rgba(0,229,204,.25);  color:var(--teal); }
.alert-ok     { background:var(--green-dim);     border-color:rgba(0,230,118,.25);  color:var(--green); }
.alert-warn   { background:var(--amber-dim);     border-color:rgba(255,170,0,.3);   color:var(--amber); }
.alert-sheriff{ background:rgba(255,215,0,.08);  border-color:rgba(255,215,0,.3);   color:var(--gold); }

/* ════════════════════════════════
   PLAYER LIST
════════════════════════════════ */
.p-list { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.p-row {
  display:flex; align-items:center; gap:10px;
  background:var(--surface2); border:1px solid var(--border); border-radius:9px;
  padding:10px 13px; transition:all .2s;
  animation:rowSlide .3s ease both;
}
.p-row:hover { background:var(--surface3); border-color:var(--border2); }
.p-row.dead  { opacity:.3; text-decoration:line-through; }
@keyframes rowSlide { from{opacity:0;transform:translateX(-14px);} to{opacity:1;transform:none;} }
.p-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.p-dot-on  { background:var(--green); box-shadow:0 0 8px var(--green); }
.p-dot-off { background:var(--red); }
.p-name { flex:1; font-weight:600; font-size:15px; }
.p-badge {
  font-family:'Fira Code',monospace; font-size:9px; letter-spacing:1.5px;
  text-transform:uppercase; background:var(--surface3); border:1px solid var(--border2);
  border-radius:5px; padding:2px 8px; color:var(--text2); white-space:nowrap;
}

/* ════════════════════════════════
   ROOM CODE
════════════════════════════════ */
.code-block {
  background:var(--surface2); border:1px solid var(--border2); border-radius:10px;
  padding:18px; text-align:center; margin-bottom:14px; position:relative;
}
.code-block::before {
  content:'ROOM CODE'; display:block;
  font-family:'Fira Code',monospace; font-size:9px; letter-spacing:4px;
  color:var(--text3); text-transform:uppercase; margin-bottom:8px;
}
.code-val {
  font-family:'Black Ops One',cursive; font-size:42px; letter-spacing:18px;
  background:linear-gradient(135deg,var(--teal),#44ffdd);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  filter:drop-shadow(0 0 12px rgba(0,229,204,.4));
}
.link-row {
  display:flex; gap:6px; align-items:center; background:var(--surface2);
  border:1px solid var(--border); border-radius:8px; padding:9px 12px; margin-bottom:14px;
}
.link-row span { flex:1; font-size:11px; color:var(--text3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-family:'Fira Code',monospace; }
.link-row button { flex-shrink:0; background:var(--teal); border:none; border-radius:5px; color:#000; font-family:'Black Ops One',cursive; font-size:11px; letter-spacing:2px; padding:5px 12px; cursor:pointer; transition:all .2s; }
.link-row button:hover { background:#44ffee; }

/* ════════════════════════════════
   ROLE SETTINGS
════════════════════════════════ */
.role-grid { background:var(--surface2); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:14px; }
.role-item { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border); }
.role-item:last-child { border-bottom:none; }
.role-item:hover { background:var(--surface3); }
.role-icon { font-size:22px; width:30px; text-align:center; flex-shrink:0; }
.role-info { flex:1; }
.role-name { font-weight:700; font-size:15px; }
.role-hint { font-size:11px; color:var(--text3); font-family:'Fira Code',monospace; margin-top:1px; }
.counter { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.ctr-btn {
  width:30px; height:30px; background:var(--surface3); border:1px solid var(--border2);
  border-radius:7px; color:var(--text); font-size:20px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; transition:all .15s;
  font-family:'Black Ops One',cursive; user-select:none;
}
.ctr-btn:hover { background:var(--border2); border-color:var(--teal); color:var(--teal); }
.ctr-btn:active { transform:scale(.9); }
.ctr-val { font-family:'Black Ops One',cursive; font-size:22px; min-width:24px; text-align:center; color:var(--teal); }

/* ════════════════════════════════
   CHOICE LIST
════════════════════════════════ */
.choice-list { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
.choice-btn {
  display:flex; align-items:center; gap:12px; width:100%;
  background:var(--surface2); border:1px solid var(--border); border-radius:9px;
  padding:13px 15px; cursor:pointer; text-align:left;
  font-family:'Exo 2',sans-serif; font-size:16px; font-weight:600;
  color:var(--text); transition:all .18s; user-select:none;
}
.choice-btn:hover  { background:var(--teal-dim); border-color:rgba(0,229,204,.35); transform:translateX(4px); }
.choice-btn.sel-red   { background:var(--red-dim);   border-color:rgba(255,34,68,.4);  color:#fff; }
.choice-btn.sel-teal  { background:var(--teal-dim);  border-color:rgba(0,229,204,.4);  color:#fff; }
.choice-btn.sel-gold  { background:rgba(255,215,0,.1); border-color:rgba(255,215,0,.4); color:#fff; }
.choice-btn:active { transform:scale(.98) translateX(2px); }
.choice-marker { width:20px; height:20px; border-radius:50%; border:1.5px solid currentColor; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:11px; opacity:.4; transition:opacity .15s; }
.choice-btn.sel-red .choice-marker,
.choice-btn.sel-teal .choice-marker,
.choice-btn.sel-gold .choice-marker { opacity:1; }

/* ════════════════════════════════
   PHASE BANNER
════════════════════════════════ */
.phase-banner {
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--surface2); border:1px solid var(--border2); border-radius:8px;
  padding:8px 16px; margin-bottom:20px;
  font-family:'Fira Code',monospace; font-size:11px; letter-spacing:3px;
  text-transform:uppercase; color:var(--text2);
}
.phase-night  { border-color:rgba(187,136,255,.3); color:var(--purple); background:var(--purple-dim); }
.phase-day    { border-color:rgba(255,170,0,.3);   color:var(--amber);  background:var(--amber-dim); }
.phase-vote   { border-color:rgba(255,34,68,.3);   color:var(--red);    background:var(--red-dim); }
.phase-sheriff{ border-color:rgba(255,215,0,.35);  color:var(--gold);   background:rgba(255,215,0,.08); }

/* ════════════════════════════════
   ROLE REVEAL
════════════════════════════════ */
.role-reveal-wrap { text-align:center; padding:16px 0; }
.role-emoji-big {
  font-size:80px; display:block; margin-bottom:14px;
  animation:rolePop .6s cubic-bezier(.34,1.56,.64,1) both;
  filter:drop-shadow(0 0 24px rgba(255,255,255,.15));
}
@keyframes rolePop { from{transform:scale(.2) translateY(-30px);opacity:0;} to{transform:none;opacity:1;} }
.role-chip {
  display:inline-block; padding:7px 22px; border-radius:30px;
  font-family:'Black Ops One',cursive; font-size:19px; letter-spacing:4px;
  margin-bottom:14px; border:1px solid;
}
.chip-mafia    { background:rgba(255,34,68,.15);  border-color:rgba(255,34,68,.5);  color:var(--red);    box-shadow:0 0 20px rgba(255,34,68,.3); }
.chip-doctor   { background:var(--green-dim);     border-color:rgba(0,230,118,.4);  color:var(--green);  box-shadow:0 0 20px rgba(0,230,118,.25); }
.chip-detective{ background:var(--blue-dim);      border-color:rgba(68,136,255,.4); color:var(--blue);   box-shadow:0 0 20px rgba(68,136,255,.25); }
.chip-cupid    { background:rgba(255,105,180,.1); border-color:rgba(255,105,180,.4);color:#ff69b4;       box-shadow:0 0 20px rgba(255,105,180,.2); }
.chip-jester   { background:var(--amber-dim);     border-color:rgba(255,170,0,.4);  color:var(--amber);  box-shadow:0 0 20px rgba(255,170,0,.2); }

<body>
<!-- BG -->
<div id="bg-scene">
  <div id="bg-grid"></div>
  <div id="bg-glow1"></div><div id="bg-glow2"></div><div id="bg-glow3"></div>
  <canvas id="pt-canvas"></canvas>
  <div id="bg-vignette"></div>
</div>
<div id="curtain"></div>

<!-- VOICE BAR (built dynamically) -->
<div id="voice-bar"></div>

<div id="app"></div>

<script>
/* ═══════════════════════════════════
   PARTICLES
═══════════════════════════════════ */
(function(){
  const c=document.getElementById('pt-canvas');
  const ctx=c.getContext('2d');
  let W,H,pts=[];
  const resize=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};
  resize();addEventListener('resize',resize);
  const COLS=['0,229,204','255,34,68','68,136,255','255,170,0'];
  for(let i=0;i<70;i++) pts.push({
    x:Math.random()*3000,y:Math.random()*2000,
    r:Math.random()*.9+.15,
    vx:(Math.random()-.5)*.25,vy:(Math.random()-.5)*.18,
    a:Math.random()*.12+.02,
    col:COLS[Math.floor(Math.random()*COLS.length)]
  });
  function loop(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(d=>{
      d.x=(d.x+d.vx+W)%W;d.y=(d.y+d.vy+H)%H;
      ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${d.col},${d.a})`;ctx.fill();
    });
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ═══════════════════════════════════
   DATA
═══════════════════════════════════ */
const ROLES={
  Mafia:    {e:'🔪',label:'mafia',   chip:'chip-mafia'},
  Doctor:   {e:'💊',label:'doctor',  chip:'chip-doctor'},
  Detective:{e:'🔍',label:'detective',chip:'chip-detective'},
  Cupid:    {e:'💘',label:'cupid',   chip:'chip-cupid'},
  Jester:   {e:'🃏',label:'jester',  chip:'chip-jester'},
  Civilian: {e:'🏙️',label:'civilian',chip:'chip-civilian'},
  Sheriff:  {e:'⭐',label:'sheriff', chip:'chip-sheriff'},
};
const RDESC={
  Mafia:    'Each night, choose someone to eliminate. Win when Mafia equal or outnumber the town.',
  Doctor:   'Each night, choose one person to protect from death. You may protect yourself.',
  Detective:'Each night, secretly investigate one player to learn if they are Mafia.',
  Cupid:    'On Night 1 only: link two souls as lovers. If one dies, the other follows.',
  Jester:   'Win by getting voted out by the town. Act suspicious — but not too obvious.',
  Civilian: 'Find and vote out all Mafia before they take over the town.',
  Sheriff:  'Once per game, you may SHOOT one player during the day. If they are Mafia, you win the round. If they are innocent, you are eliminated and revealed as Sheriff.',
};

/* ═══════════════════════════════════
   STATE
═══════════════════════════════════ */
let S={
  screen:'welcome',playerName:'',isHost:false,roomCode:'',
  error:'',loading:false,connectionAttempt:0,
  peer:null,conn:null,conns:{},myId:null,
  lobbyPlayers:[],players:[],
  settings:{mafia:2,doctor:1,detective:1,cupid:0,jester:0,sheriff:1},
  phase:'',myRole:'',nightNumber:1,nightDead:[],narration:'',
  nightActions:{},nightActionType:null,nightActionTargets:[],nightActionResult:null,
  cupidPick:[],_nightQ:[],_curActor:null,
  lovers:[],votedOut:null,voteData:{},_voteExpected:0,
  winner:null,_rolesReady:0,_totalPlayers:0,
  sheriffUsed:false,sheriffTarget:null,sheriffResult:null,
  voiceEnabled:false,voiceSelfMuted:false,voiceMutedByHost:false,
  voiceHostMuteAll:false,voiceSpeaking:{},voicePlayerMutes:{},
  _detTarget:null,_detName:'',
};

/* ═══════════════════════════════════
   TRANSITION
═══════════════════════════════════ */
let _tw=null;
function transition(fn,fast=false){
  const el=document.getElementById('curtain');
  el.classList.add('show');clearTimeout(_tw);
  _tw=setTimeout(()=>{fn();el.classList.remove('show');},fast?160:260);
}

/* ═══════════════════════════════════
   TYPEWRITER
═══════════════════════════════════ */
let _twTimer=null;
function typewrite(id,text,speed=24){
  const el=document.getElementById(id);if(!el)return;
  clearTimeout(_twTimer);el.textContent='';el.classList.add('tw');
  let i=0;
  function tick(){if(i<text.length){el.textContent+=text[i++];_twTimer=setTimeout(tick,speed);}else el.classList.remove('tw');}
  tick();
}

/* ═══════════════════════════════════
   VOICE MODULE
═══════════════════════════════════ */
const VOICE={
  stream:null,calls:{},audios:{},analyser:null,actx:null,speaking:false,_tick:null,levels:{},_afId:null,
  async init(){
    try{
      this.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      this.actx=new(window.AudioContext||window.webkitAudioContext)();
      const src=this.actx.createMediaStreamSource(this.stream);
      this.analyser=this.actx.createAnalyser();this.analyser.fftSize=256;
      src.connect(this.analyser);this.startDetect();
      S.voiceEnabled=true;buildVoiceBar();
      Object.keys(S.conns).forEach(pid=>this.callPeer(pid));
      if(!S.isHost&&S.conn)S.conn.send({type:'voice-ready',peerId:S.peer?.id});
      return true;
    }catch(e){S.voiceEnabled=false;buildVoiceBar();return false;}
  },
  startDetect(){
    if(this._tick)clearInterval(this._tick);
    const data=new Uint8Array(this.analyser.frequencyBinCount);
    this._tick=setInterval(()=>{
      if(!this.analyser)return;
      this.analyser.getByteFrequencyData(data);
      const avg=data.reduce((a,b)=>a+b,0)/data.length;
      this.levels[S.myId||'host']=avg;
      const now=avg>12&&!S.voiceSelfMuted&&!S.voiceMutedByHost&&!S.voiceHostMuteAll;
      if(now!==this.speaking){
        this.speaking=now;S.voiceSpeaking[S.myId||'host']=now;
        const m={type:'speaking',id:S.myId||'host',val:now,level:avg};
        if(S.isHost)broadcast(m);else if(S.conn)S.conn.send(m);
      }
      updateVoiceBarsLive(avg);
    },80);
  },
  callPeer(pid){if(!this.stream||this.calls[pid])return;const call=S.peer?.call(pid,this.stream);if(!call)return;this.calls[pid]=call;call.on('stream',s=>this.attachAudio(pid,s));call.on('close',()=>{delete this.calls[pid];this.detachAudio(pid);});},
  answerCall(call){this.calls[call.peer]=call;call.answer(this.stream||new MediaStream());call.on('stream',s=>this.attachAudio(call.peer,s));call.on('close',()=>{delete this.calls[call.peer];this.detachAudio(call.peer);});},
  attachAudio(pid,stream){if(this.audios[pid]){this.audios[pid].srcObject=stream;return;}const a=document.createElement('audio');a.srcObject=stream;a.autoplay=true;a.playsInline=true;a.volume=1;document.body.appendChild(a);this.audios[pid]=a;this.applyMute(pid);},
  detachAudio(pid){if(this.audios[pid]){this.audios[pid].srcObject=null;this.audios[pid].remove();delete this.audios[pid];}},
  applyMute(pid){const a=this.audios[pid];if(!a)return;a.muted=S.voiceHostMuteAll||(S.voicePlayerMutes[pid]||false);},
  applyAll(){Object.keys(this.audios).forEach(pid=>this.applyMute(pid));if(this.stream){const t=this.stream.getAudioTracks()[0];if(t)t.enabled=!S.voiceSelfMuted&&!S.voiceMutedByHost&&!S.voiceHostMuteAll;}},
  setGlobalMute(val){S.voiceHostMuteAll=val;this.applyAll();broadcast({type:'voice-global-mute',muted:val});buildVoiceBar();},
  destroy(){
    if(this._tick)clearInterval(this._tick);if(this._afId)cancelAnimationFrame(this._afId);
    Object.values(this.calls).forEach(c=>{try{c.close();}catch(e){}});this.calls={};
    Object.values(this.audios).forEach(a=>{a.srcObject=null;a.remove();});this.audios={};
    if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null;
    if(this.actx)this.actx.close();this.actx=null;
  }
};

/* ═══════════════════════════════════
   VOICE BAR (E2E DESIGN)
═══════════════════════════════════ */
function buildVoiceBar(){
  const bar=document.getElementById('voice-bar');
  if(!bar)return;
  const show=(S.screen==='lobby'||S.screen==='game');
  bar.classList.toggle('vb-show',show);
  if(!show){bar.innerHTML='';return;}

  if(!S.voiceEnabled){
    bar.innerHTML=`<button class="vb-enable-btn" id="vb-enable-btn">🎤 <span>Enable Voice Chat</span></button>`;
    const enBtn=document.getElementById('vb-enable-btn');
    if(enBtn)enBtn.onclick=async()=>{await VOICE.init();};
    return;
  }

  const myId=S.myId||'host';
  const isMuted=S.voiceSelfMuted||S.voiceMutedByHost||S.voiceHostMuteAll;
  const isSpeaking=S.voiceSpeaking[myId]&&!isMuted;
  const waveClass=isMuted?'muted':isSpeaking?'active':'idle';
  const micClass=isSpeaking?'speak':isMuted?'muted':'live';
  const micIcon=isMuted?'🔇':'🎤';

  // Speakers row (other players)
  const speakerPlayers=S.lobbyPlayers.length>0?S.lobbyPlayers:S.players;
  const otherSpeakers=speakerPlayers.filter(p=>(p.id||'host')!==myId&&S.voiceEnabled);
  const speakersHtml=otherSpeakers.length>0?`
    <div class="vb-speakers">
      ${otherSpeakers.map(p=>{
        const pid=p.id||'host';
        const spk=S.voiceSpeaking[pid]&&!S.voiceHostMuteAll&&!S.voicePlayerMutes[pid];
        const hsh=S.voiceHostMuteAll||(S.voicePlayerMutes[pid]||false);
        return`<div class="vb-avatar ${spk?'speaking':hsh?'hushed':''}" id="vba-${pid}">
          <div class="vb-awave">
            <div class="vb-aw" style="height:${spk?10:3}px"></div>
            <div class="vb-aw" style="height:${spk?14:3}px"></div>
            <div class="vb-aw" style="height:${spk?8:3}px"></div>
          </div>
          <span class="vb-aname">${esc(p.name||'?')}</span>
          ${S.isHost&&p.id?`<button class="mute-p-btn ${S.voicePlayerMutes[p.id]?'muted':''}" onclick="event.stopPropagation();hostToggleMute('${p.id}')">${S.voicePlayerMutes[p.id]?'UN':'🔇'}</button>`:''}
        </div>`;
      }).join('')}
    </div>`:
  '';

  // Host controls
  const hostHtml=S.isHost?`
    <div class="vb-host-bar">
      <button class="vb-host-btn ${S.voiceHostMuteAll?'active':''}" id="vb-mute-all">
        ${S.voiceHostMuteAll?'🔊 UNMUTE ALL':'🔇 MUTE ALL'}
      </button>
    </div>`:
  '';

  bar.innerHTML=`
    ${speakersHtml}
    ${hostHtml}
    <div class="vb-pill ${isSpeaking?'speaking':isMuted?'muted-s':''}">
      <div class="vb-wave ${waveClass}">
        <div class="vb-bar"></div><div class="vb-bar"></div><div class="vb-bar"></div>
        <div class="vb-bar"></div><div class="vb-bar"></div><div class="vb-bar"></div>
        <div class="vb-bar"></div>
      </div>
      <div class="vb-info">
        <div class="vb-name">${esc(S.playerName||'You')}</div>
        <div class="vb-status ${isSpeaking?'speak':isMuted?'muted':'live'}">
          ${isSpeaking?'● SPEAKING':isMuted?'● MUTED':'● LIVE'}
        </div>
      </div>
      <button class="vb-mic-btn ${micClass}" id="vb-mic-btn">${micIcon}</button>
    </div>`;

  const micBtn=document.getElementById('vb-mic-btn');
  if(micBtn)micBtn.onclick=()=>{S.voiceSelfMuted=!S.voiceSelfMuted;VOICE.applyAll();buildVoiceBar();};
  const muteAll=document.getElementById('vb-mute-all');
  if(muteAll)muteAll.onclick=()=>{if(S.isHost)VOICE.setGlobalMute(!S.voiceHostMuteAll);};
}

function updateVoiceBarsLive(level){
  // Animate the main bars based on microphone level
  const bars=document.querySelectorAll('.vb-pill .vb-bar');
  if(!bars.length)return;
  const isMuted=S.voiceSelfMuted||S.voiceMutedByHost||S.voiceHostMuteAll;
  if(isMuted)return;
  const base=[8,14,20,14,8,12,6];
  bars.forEach((bar,i)=>{
    const h=Math.max(3,Math.min(28,base[i]*(level/20)*(0.8+Math.random()*.4)));
    bar.style.height=h+'px';
  });
}

function buildVoteBars(){
  const alive=S.players.filter(p=>p.alive);const total=alive.length||1;const counts={};
  alive.forEach(p=>{const v=S.voteData[p.id];if(v&&v!=='__abstain__')counts[v]=(counts[v]||0)+1;});
  const cast=Object.keys(S.voteData).length;if(!cast)return'';
  return`<div class="vtally">
    <div class="vtally-head">Votes Cast: ${cast} / ${total}</div>
    ${alive.map(p=>{const n=counts[p.id]||0,pct=Math.round(n/total*100);
      return`<div class="v-entry">
        <div class="v-label"><span>${esc(p.name)}</span><span>${n}</span></div>
        <div class="v-track"><div class="v-fill" style="width:${pct}%"></div></div>
      </div>`;}).join('')}
  </div>`;
}

   BIND
═══════════════════════════════════ */
function bind(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',fn);};
  on('goBtnStart',      ()=>transition(()=>{S.screen='name';S.error='';render();}));
  on('goBtnBackWelcome',()=>transition(()=>{S.screen='welcome';render();}));
  on('goBtnBackMode',   ()=>transition(()=>{S.screen='mode';S.error='';S.loading=false;render();}));
  on('goBtnJoin',       ()=>transition(()=>{S.screen='join';S.error='';render();}));
  on('goBtnNameNext',   ()=>{
    const v=document.getElementById('inp-name')?.value.trim();
    if(!v){S.error='Please enter your name.';render();return;}
    S.playerName=v;S.error='';
    const fromLink=new URLSearchParams(location.search).get('room');
    if(fromLink){S.roomCode=fromLink.toUpperCase();S.screen='join';}
    else S.screen='mode';
    transition(()=>render());
  });
  on('goBtnCreate',      createRoom);
  on('goBtnJoinConnect', doJoin);
  on('goBtnCopyLink',    ()=>{
    const link=`${location.origin}${location.pathname}?room=${S.roomCode}`;
    navigator.clipboard.writeText(link).then(()=>{
      const b=document.getElementById('goBtnCopyLink');
      if(b){b.textContent='✓ COPIED';setTimeout(()=>{const bb=document.getElementById('goBtnCopyLink');if(bb)bb.textContent='COPY';},2000);}
    }).catch(()=>prompt('Copy this link:',link));
  });
  on('goBtnHostStart',   hostStartGame);
  on('goBtnRoleReady',   ()=>{
    if(S.isHost){S._rolesReady++;S.phase='night';S.loading=true;render();checkAllRolesReady();}
    else{S.conn.send({type:'role-seen'});S.phase='night';S.loading=true;render();}
  });
  on('goBtnDetConfirm',  ()=>sendNightAction(S.nightActionType,S._detTarget));
  on('goBtnCupidConfirm',()=>{if(S.cupidPick.length===2)sendNightAction('cupid-link',S.cupidPick);});
  on('goBtnBeginVote',   ()=>{if(S.isHost)hostBeginVoting();});
  on('goBtnNextNight',   ()=>{if(S.isHost){S.nightNumber++;hostBeginNight();}});
  on('goBtnPlayAgain',   ()=>{VOICE.destroy();location.href=location.pathname;});
  on('goBtnSheriffShoot',()=>{
    if(S.sheriffTarget&&!S.sheriffUsed){
      if(S.isHost){hostProcessSheriffShot('host',S.sheriffTarget);}
      else{S.conn.send({type:'sheriff-shot',targetId:S.sheriffTarget});S.sheriffUsed=true;S.sheriffTarget=null;render();}
    }
  });

  // Name / code keyboard
  const ni=document.getElementById('inp-name');
  if(ni){ni.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goBtnNameNext')?.click();});setTimeout(()=>ni.focus(),80);}
  const ci=document.getElementById('inp-code');
  if(ci){
    ci.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goBtnJoinConnect')?.click();});
    ci.addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});
    setTimeout(()=>ci.focus(),80);
  }

  // Night action targets
  document.querySelectorAll('[data-act-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.actId;
      if(S.nightActionType==='cupid-link'){
        if(S.cupidPick.includes(id))S.cupidPick=S.cupidPick.filter(x=>x!==id);
        else if(S.cupidPick.length<2)S.cupidPick.push(id);
        render();
      }else if(S.nightActionType==='detective-investigate'){
        const t=S.nightActionTargets.find(p=>p.id===id);
        S.nightActionResult=t?.isMafia||false;S._detName=t?.name||'';S._detTarget=id;render();
      }else{sendNightAction(S.nightActionType,id);}
    });
  });
  // Vote buttons
  document.querySelectorAll('[data-vote-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.voteId==='__skip__'?null:btn.dataset.voteId;
      submitVote(id);
    });
  });
  // Sheriff target selection
  document.querySelectorAll('[data-sheriff-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      S.sheriffTarget=btn.dataset.sheriffId;render();
    });
  });
}

/* ═══════════════════════════════════
   NETWORKING
═══════════════════════════════════ */
function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;
}

const PCONFIGS=[
  {host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun2.l.google.com:19302'}]}},
  {host:'peerjs.com',  port:443,path:'/',secure:true,debug:0,config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}},
  {host:'0.peerjs.com',port:443,path:'/',secure:true,debug:0},
  {host:'peerjs.com',  port:443,path:'/',secure:true,debug:0},
  null,
];

function makePeer(id,cfgIdx,cb){
  cfgIdx=cfgIdx||0;
  if(cfgIdx>=PCONFIGS.length){cb(null,'Could not reach game server. Check your internet connection.');return;}
  S.connectionAttempt=cfgIdx+1;
  const modeEl=document.getElementById('app');
  if(modeEl&&S.loading){render();}
  let p;
  try{
    const cfg=PCONFIGS[cfgIdx];
    p=(id&&cfg)?new Peer(id,cfg):(id?new Peer(id):(cfg?new Peer(cfg):new Peer()));
  }catch(e){makePeer(id,cfgIdx+1,cb);return;}
  const tid=setTimeout(()=>{try{p.destroy();}catch(e){}makePeer(id,cfgIdx+1,cb);},12000);
  p.on('open',()=>{clearTimeout(tid);cb(p,null);});
  p.on('error',err=>{
    clearTimeout(tid);
    if(err.type==='unavailable-id'){cb(null,'unavailable-id');return;}
    try{p.destroy();}catch(e){}
    makePeer(id,cfgIdx+1,cb);
  });
}

function createRoom(retryCount){
  retryCount=retryCount||0;
  const code=genCode();
  S.roomCode=code;S.isHost=true;S.myId='host';
  S.loading=true;S.error='';S.screen='mode';render();
  if(S.peer){try{S.peer.destroy();}catch(e){}}
  makePeer('maf-'+code.toLowerCase(),0,(p,err)=>{
    if(err==='unavailable-id'&&retryCount<5){createRoom(retryCount+1);return;}
    if(!p){S.loading=false;S.error=err||'Could not reach game server.';S.screen='mode';render();return;}
    S.peer=p;S.loading=false;
    S.lobbyPlayers=[{id:'host',name:S.playerName,isHost:true,connected:true,peerId:'maf-'+code.toLowerCase()}];
    S.screen='lobby';render();
    p.on('connection',conn=>{
      conn.on('open',()=>{
        S.conns[conn.peer]=conn;
        conn.on('data',msg=>hostOnMsg(conn,msg));
        conn.on('close',()=>{
          const pl=S.lobbyPlayers.find(x=>x.id===conn.peer);
          if(pl)pl.connected=false;
          delete S.conns[conn.peer];
          if(S.screen==='lobby')render();
        });
      });
    });
    p.on('call',call=>VOICE.answerCall(call));
  });
}

function doJoin(){
  const code=(document.getElementById('inp-code')?.value||'').trim().toUpperCase();
  if(!code||code.length<4){S.error='Please enter a valid room code.';render();return;}
  S.roomCode=code;S.isHost=false;S.loading=true;S.error='';render();
  if(S.peer){try{S.peer.destroy();}catch(e){}}
  makePeer(null,0,(p,err)=>{
    if(!p){S.loading=false;S.error=err||'Could not reach game server.';S.screen='join';render();return;}
    S.peer=p;S.myId=p.id;
    const hostId='maf-'+code.toLowerCase();
    const conn=p.connect(hostId,{reliable:true});
    const ctid=setTimeout(()=>{
      if(S.loading){S.loading=false;S.error='Could not connect — is the room code correct?';S.screen='join';render();}
    },12000);
    conn.on('open',()=>{clearTimeout(ctid);S.loading=false;S.conn=conn;conn.send({type:'join',name:S.playerName,peerId:p.id});S.screen='lobby';render();});
    conn.on('data',msg=>guestOnMsg(msg));
    conn.on('close',()=>{if(S.phase!=='over'){S.error='Lost connection to host.';S.screen='join';S.loading=false;render();}});
    conn.on('error',()=>{clearTimeout(ctid);S.error='Connection failed. Check the room code.';S.loading=false;S.screen='join';render();});
    p.on('call',call=>VOICE.answerCall(call));
  });
}

function broadcast(msg){Object.values(S.conns).forEach(c=>{try{c.send(msg);}catch(e){}});}
function broadcastLobby(){broadcast({type:'lobby',players:S.lobbyPlayers,settings:S.settings});}

/* ═══════════════════════════════════
   HOST MSG HANDLER
═══════════════════════════════════ */
function hostOnMsg(conn,msg){
  if(msg.type==='join'){
    const id=conn.peer;
    const ex=S.lobbyPlayers.find(p=>p.id===id);
    if(ex){ex.connected=true;ex.name=msg.name;ex.peerId=msg.peerId||id;}
    else S.lobbyPlayers.push({id,name:msg.name,isHost:false,connected:true,peerId:msg.peerId||id});
    const newPid=msg.peerId||id;
    Object.values(S.conns).forEach(c=>{if(c.peer!==id){try{c.send({type:'peer-joined',peerId:newPid});}catch(e){}}});
    const existing=S.lobbyPlayers.filter(p=>p.id!==id&&p.peerId).map(p=>p.peerId);
    conn.send({type:'existing-peers',peers:existing});
    broadcastLobby();render();
  }
  else if(msg.type==='role-seen'){S._rolesReady++;checkAllRolesReady();}
  else if(msg.type==='night-action'){hostProcessAction(conn.peer,msg.actionType,msg.target);}
  else if(msg.type==='vote'){hostProcessVote(conn.peer,msg.targetId);}
  else if(msg.type==='sheriff-shot'){hostProcessSheriffShot(conn.peer,msg.targetId);}
  else if(msg.type==='speaking'){S.voiceSpeaking[msg.id]=msg.val;broadcast(msg);buildVoiceBar();}
  else if(msg.type==='voice-ready'){if(VOICE.stream&&msg.peerId)VOICE.callPeer(msg.peerId);}
}
function checkAllRolesReady(){if(S._rolesReady>=S._totalPlayers){S._rolesReady=0;hostBeginNight();}}

/* ═══════════════════════════════════
   GUEST MSG HANDLER
═══════════════════════════════════ */
function guestOnMsg(msg){
  if(msg.type==='lobby'){S.lobbyPlayers=msg.players;S.settings=msg.settings;S.screen='lobby';render();}
  else if(msg.type==='game-start'){S.myRole=msg.role;S.players=msg.players;S.phase='roleReveal';S.screen='game';transition(()=>render());}
  else if(msg.type==='night-begin'){S.nightNumber=msg.nightNumber;S.phase='night';S.narration='';S.loading=true;render();}
  else if(msg.type==='night-start'){S.phase='night';S.narration=msg.narration||'';S.loading=false;S.nightNumber=msg.nightNumber||S.nightNumber;S.nightActionType=null;S.nightActionResult=null;S.cupidPick=[];render();}
  else if(msg.type==='your-turn'){S.phase='nightAction';S.nightActionType=msg.actionType;S.nightActionTargets=msg.targets;S.nightActionResult=null;S.cupidPick=[];render();}
  else if(msg.type==='day-start'){S.phase='day';S.nightDead=msg.dead;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.nightNumber=msg.nightNumber;S.sheriffTarget=null;transition(()=>render());}
  else if(msg.type==='vote-start'){S.phase='vote';S.voteData={};S.players=msg.players;render();}
  else if(msg.type==='vote-update'){S.voteData=msg.voteData||S.voteData;render();}
  else if(msg.type==='vote-result'){S.phase='voteResult';S.votedOut=msg.eliminated;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.winner=msg.winner||null;render();}
  else if(msg.type==='game-over'){S.phase='over';S.winner=msg.winner;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.screen='game';transition(()=>render());}
  else if(msg.type==='sheriff-result'){
    S.players=msg.players;S.sheriffUsed=true;
    if(msg.hit){alert(`⭐ Sheriff ${msg.sheriffName} shot ${msg.targetName} — who WAS Mafia! Town scores a point.`);}
    else{alert(`⭐ Sheriff ${msg.sheriffName} shot ${msg.targetName} — who was INNOCENT! The Sheriff has been eliminated.`);}
    render();
  }
  else if(msg.type==='voice-global-mute'){S.voiceMutedByHost=msg.muted;VOICE.applyAll();buildVoiceBar();}
  else if(msg.type==='voice-muted-by-host'){S.voiceMutedByHost=msg.muted;VOICE.applyAll();buildVoiceBar();}
  else if(msg.type==='speaking'){S.voiceSpeaking[msg.id]=msg.val;buildVoiceBar();}
  else if(msg.type==='peer-joined'){if(VOICE.stream)VOICE.callPeer(msg.peerId);}
  else if(msg.type==='existing-peers'){if(VOICE.stream)msg.peers.forEach(pid=>{if(pid!==S.peer?.id)VOICE.callPeer(pid);});}
}

/* ═══════════════════════════════════
   GAME LOGIC (HOST)
═══════════════════════════════════ */
async function hostStartGame(){
  const pl=S.lobbyPlayers;
  if(pl.length<4){S.error='Need at least 4 players!';render();return;}
  const cfg=S.settings;
  const spec=cfg.mafia+cfg.doctor+cfg.detective+cfg.cupid+cfg.jester+cfg.sheriff;
  if(spec>pl.length){S.error='Too many special roles for player count!';render();return;}
  const roles=[];
  for(let i=0;i<cfg.mafia;i++)roles.push('Mafia');
  if(cfg.doctor)roles.push('Doctor');
  if(cfg.detective)roles.push('Detective');
  if(cfg.cupid)roles.push('Cupid');
  if(cfg.jester)roles.push('Jester');
  if(cfg.sheriff)roles.push('Sheriff');
  while(roles.length<pl.length)roles.push('Civilian');
  const shuffled=shuffle(roles);
  S.players=pl.map((p,i)=>({id:p.id,name:p.name,role:shuffled[i],alive:true}));
  S.lovers=[];S.nightNumber=1;S.nightActions={};
  S._totalPlayers=pl.length;S._rolesReady=0;S.sheriffUsed=false;
  if(VOICE.stream)VOICE.setGlobalMute(true);
  S.players.forEach(player=>{
    const vis=S.players.map(p=>({
      id:p.id,name:p.name,alive:p.alive,
      role:(p.id===player.id||(player.role==='Mafia'&&p.role==='Mafia'))?p.role:undefined
    }));
    if(player.id==='host'){S.myRole=player.role;S.screen='game';S.phase='roleReveal';}
    else S.conns[player.id]?.send({type:'game-start',role:player.role,players:vis});
  });
  transition(()=>render());
}

/* ─── SHERIFF SHOT ─── */
async function hostProcessSheriffShot(shooterId,targetId){
  // Find the shooter and target
  const shooter=S.players.find(p=>p.id===shooterId);
  const target=S.players.find(p=>p.id===targetId&&p.alive);
  if(!shooter||!target||S.sheriffUsed)return;
  S.sheriffUsed=true;
  const hit=target.role==='Mafia';

  if(hit){
    // Sheriff hit a Mafia — target is eliminated
    S.players=S.players.map(p=>({...p,alive:p.id===targetId?false:p.alive}));
    const narPrompt=`Mafia game: Sheriff ${shooter.name} shot ${target.name} who WAS Mafia! One dramatic sentence about justice served.`;
    const narr=await callGM(narPrompt);
    S.narration=narr;
    const w=checkWin(S.players);
    const resultMsg={type:'sheriff-result',hit:true,sheriffName:shooter.name,targetName:target.name,players:S.players};
    broadcast(resultMsg);
    if(S.isHost||(S.myId||'host')===shooterId){
      alert(`⭐ You shot ${target.name} — they WERE Mafia! Target eliminated.`);
    }
    if(w){await hostEndGame(w);return;}
    // Continue to day
    S.nightDead=[];render();
  }else{
    // Sheriff shot innocent — Sheriff is eliminated
    S.players=S.players.map(p=>({...p,alive:p.id===shooterId?false:p.alive}));
    // Lovers cascade
    if(S.lovers.includes(shooterId)){
      S.lovers.forEach(lid=>{if(lid!==shooterId)S.players=S.players.map(p=>({...p,alive:p.id===lid?false:p.alive}));});
    }
    const narPrompt=`Mafia game: Sheriff ${shooter.name} shot ${target.name} who was INNOCENT. The Sheriff has been eliminated. One dramatic sentence.`;
    const narr=await callGM(narPrompt);
    const resultMsg={type:'sheriff-result',hit:false,sheriffName:shooter.name,targetName:target.name,players:S.players};
    broadcast(resultMsg);
    if((S.myId||'host')===shooterId){
      alert(`⭐ You shot ${target.name} — they were INNOCENT. You have been eliminated!`);
    }else{
      alert(`⭐ Sheriff ${shooter.name} shot ${target.name} — who was INNOCENT! The Sheriff has been eliminated and revealed.`);
    }
    const w=checkWin(S.players);
    if(w){await hostEndGame(w);return;}
    render();
  }
}

async function hostBeginNight(){
  S.nightActions={};S._nightQ=[];S.phase='night';S.loading=true;S.sheriffTarget=null;
  if(VOICE.stream)VOICE.setGlobalMute(true);
  render();broadcast({type:'night-begin',nightNumber:S.nightNumber});
  const t=await callGM(`Mafia game. Night ${S.nightNumber} in a gritty city. One atmospheric sentence about darkness falling.`);
  S.narration=t;S.loading=false;
  broadcast({type:'night-start',narration:t,nightNumber:S.nightNumber});
  render();buildAndRunNightQueue();
}

function buildAndRunNightQueue(){
  const alive=S.players.filter(p=>p.alive);const q=[];
  if(S.nightNumber===1){const c=alive.find(p=>p.role==='Cupid');if(c)q.push(c);}
  const mafia=alive.filter(p=>p.role==='Mafia');if(mafia.length>0)q.push(mafia[0]);
  const doc=alive.find(p=>p.role==='Doctor');if(doc)q.push(doc);
  const det=alive.find(p=>p.role==='Detective');if(det)q.push(det);
  S._nightQ=[...q];runNextNightActor();
}

function runNextNightActor(){
  if(!S._nightQ||S._nightQ.length===0){hostResolveNight();return;}
  const actor=S._nightQ.shift();S._curActor=actor;
  const alive=S.players.filter(p=>p.alive);const others=alive.filter(p=>p.id!==actor.id);
  let actionType='';let targets=[];
  if(actor.role==='Cupid'){actionType='cupid-link';targets=alive.map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Mafia'){actionType='mafia-kill';targets=others.filter(p=>p.role!=='Mafia').map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Doctor'){actionType='doctor-protect';targets=alive.map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Detective'){actionType='detective-investigate';targets=others.map(p=>({id:p.id,name:p.name,isMafia:p.role==='Mafia'}));}
  if(actor.id==='host'){
    S.phase='nightAction';S.nightActionType=actionType;S.nightActionTargets=targets;S.nightActionResult=null;S.cupidPick=[];render();
  }else{
    S.conns[actor.id]?.send({type:'your-turn',actionType,targets});S.phase='night';render();
  }
}

function sendNightAction(actionType,target){
  if(S.isHost){hostProcessAction('host',actionType,target);S.phase='night';render();}
  else{S.conn.send({type:'night-action',actionType,target});S.phase='night';S.nightActionType=null;render();}
}

function hostProcessAction(actorId,actionType,target){
  if(actionType==='mafia-kill')S.nightActions.mafiaTarget=target;
  else if(actionType==='doctor-protect')S.nightActions.doctorTarget=target;
  else if(actionType==='detective-investigate')S.nightActions.detectiveTarget=target;
  else if(actionType==='cupid-link'){
    S.nightActions.cupidTargets=Array.isArray(target)?target:[target];
    S.lovers=S.nightActions.cupidTargets;
    S.players=S.players.map(p=>({...p,isLover:S.lovers.includes(p.id)}));
  }
  runNextNightActor();
}

async function hostResolveNight(){
  const na=S.nightActions;let dead=[];
  if(na.mafiaTarget&&na.mafiaTarget!==na.doctorTarget){
    const t=S.players.find(p=>p.id===na.mafiaTarget&&p.alive);if(t)dead.push(t);
  }
  const seen=new Set(dead.map(d=>d.id));let chg=true;
  while(chg){chg=false;[...dead].forEach(d=>{if(S.lovers.includes(d.id)){S.lovers.forEach(lid=>{if(lid!==d.id&&!seen.has(lid)){const p=S.players.find(x=>x.id===lid&&x.alive);if(p){dead.push(p);seen.add(lid);chg=true;}}});}});}
  const deadSet=new Set(dead.map(d=>d.id));
  S.players=S.players.map(p=>({...p,alive:deadSet.has(p.id)?false:p.alive}));
  S.nightDead=dead;S.nightActions={};S.loading=true;render();
  const w=checkWin(S.players);
  const prompt=dead.length===0
    ?`Mafia game. Night ${S.nightNumber}: the doctor saved someone. One eerie sentence about a quiet dawn.`
    :`Mafia game. Night ${S.nightNumber}: found dead: ${dead.map(d=>d.name).join(', ')}. Two atmospheric sentences.`;
  const t=await callGM(prompt);S.narration=t;S.loading=false;
  if(w){await hostEndGame(w);return;}
  if(VOICE.stream)VOICE.setGlobalMute(false);
  const dayMsg={type:'day-start',dead:dead.map(d=>({id:d.id,name:d.name,role:d.role})),narration:t,players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive})),nightNumber:S.nightNumber};
  broadcast(dayMsg);S.phase='day';transition(()=>render());
}

function hostBeginVoting(){
  const alive=S.players.filter(p=>p.alive);
  S.voteData={};S._voteExpected=alive.length;
  broadcast({type:'vote-start',players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive}))});
  S.phase='vote';render();
}

function submitVote(targetId){
  const myId=S.myId||'host';const vv=targetId===null?'__abstain__':targetId;
  S.voteData[myId]=vv;render();
  if(S.isHost)hostProcessVote('host',targetId);
  else S.conn.send({type:'vote',targetId});
}

function hostProcessVote(voterId,targetId){
  const vv=targetId===null?'__abstain__':targetId;
  S.voteData[voterId]=vv;
  const alive=S.players.filter(p=>p.alive);
  const cast=alive.filter(p=>S.voteData.hasOwnProperty(p.id)).length;
  broadcast({type:'vote-update',voteData:S.voteData});
  if(cast>=alive.length)hostResolveVote();
  else render();
}

async function hostResolveVote(){
  const alive=S.players.filter(p=>p.alive);const counts={};
  alive.forEach(p=>{const v=S.voteData[p.id];if(v&&v!=='__abstain__')counts[v]=(counts[v]||0)+1;});
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  let elim=null;
  if(sorted.length>0&&(sorted.length===1||sorted[0][1]>sorted[1][1]))elim=S.players.find(p=>p.id===sorted[0][0]);
  if(elim){
    S.players=S.players.map(p=>({...p,alive:p.id===elim.id?false:p.alive}));
    if(S.lovers.includes(elim.id))S.lovers.forEach(lid=>{if(lid!==elim.id)S.players=S.players.map(p=>({...p,alive:p.id===lid?false:p.alive}));});
  }
  S.votedOut=elim||null;S.loading=true;render();
  const w=checkWin(S.players,elim);
  const sheriffReveal=elim?.role==='Sheriff'?' The crowd gasped — they had eliminated their own Sheriff!':'';
  const t=await callGM(elim
    ?`Mafia game. Vote eliminated ${elim.name}, who was ${elim.role}.${sheriffReveal} Two dramatic sentences.`
    :`Mafia game. Vote tied — no elimination. One tense sentence.`);
  S.narration=t;S.loading=false;
  if(w){await hostEndGame(w);return;}
  broadcast({type:'vote-result',eliminated:elim?{id:elim.id,name:elim.name,role:elim.role}:null,narration:t,players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive})),winner:null});
  S.phase='voteResult';render();
}

async function hostEndGame(winner){
  S.winner=winner;S.loading=true;S.phase='over';
  if(VOICE.stream)VOICE.setGlobalMute(false);
  render();
  const t=await callGM(`Mafia game ended. ${winner} won. Two climactic sentences.`);
  S.narration=t;S.loading=false;
  broadcast({type:'game-over',winner,narration:t,players:S.players});
  transition(()=>render());
}

/* ═══════════════════════════════════
   HELPERS
═══════════════════════════════════ */
function checkWin(ps,elim=null){
  if(elim?.role==='Jester')return'Jester';
  const aM=ps.filter(p=>p.alive&&p.role==='Mafia').length;
  const aT=ps.filter(p=>p.alive&&p.role!=='Mafia'&&p.role!=='Jester').length;
  if(aM===0)return'Town';if(aM>=aT)return'Mafia';return null;
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

async function callGM(prompt){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    if(d.content&&d.content[0]?.text)return d.content[0].text;
    return'The city waits in uneasy silence…';
  }catch{return'The city waits in uneasy silence…';}
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ═══════════════════════════════════
   INIT
═══════════════════════════════════ */
const urlRoom=new URLSearchParams(location.search).get('room');
if(urlRoom){S.roomCode=urlRoom.toUpperCase();S.screen='name';}
render();
</script>
