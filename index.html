 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MAFIA — The Village Awaits</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root{--bg:#0a0805;--wood:#1c1208;--panel:#251a0d;--panel2:#2e2010;--amber:#d48a1c;--gold:#f0b840;--cream:#e8dcc8;--muted:#9a8a72;--red:#8b1a1a;--red2:#c0392b;--green:#1a4a2e;--green2:#27ae60;--blue:#1a2a4a;--radius:3px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:var(--cream);overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 50% 100%,rgba(180,100,0,.12),transparent 65%);pointer-events:none;z-index:0;}
#app{min-height:100vh;position:relative;z-index:1;}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.card{background:linear-gradient(160deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);border:1px solid rgba(212,138,28,.28);border-radius:var(--radius);padding:28px 24px;width:100%;max-width:460px;box-shadow:0 24px 64px rgba(0,0,0,.9),inset 0 1px 0 rgba(240,184,64,.12);position:relative;overflow:hidden;}
.card::after{content:'';position:absolute;inset:4px;border:1px solid rgba(212,138,28,.08);border-radius:2px;pointer-events:none;}
h1{font-family:'Cinzel Decorative',serif;font-size:clamp(36px,10vw,58px);color:var(--gold);text-align:center;letter-spacing:4px;text-shadow:0 0 40px rgba(240,184,64,.5),0 2px 8px rgba(0,0,0,.9);margin-bottom:6px;}
h2{font-family:'Cinzel',serif;font-size:clamp(18px,5vw,22px);color:var(--gold);text-align:center;letter-spacing:3px;margin-bottom:18px;}
h3{font-family:'Cinzel',serif;font-size:14px;color:var(--amber);letter-spacing:2px;margin-bottom:12px;}
.sub{text-align:center;color:var(--muted);font-style:italic;font-size:16px;margin-bottom:24px;line-height:1.65;}
input[type=text],input[type=number]{width:100%;background:rgba(0,0,0,.45);border:1px solid rgba(212,138,28,.35);border-radius:var(--radius);color:var(--cream);font-family:'Crimson Text',serif;font-size:18px;padding:12px 14px;outline:none;transition:border-color .2s;margin-bottom:14px;}
input::placeholder{color:rgba(200,184,152,.35);}
input:focus{border-color:var(--amber);}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:linear-gradient(180deg,rgba(212,138,28,.18),rgba(100,65,8,.45));border:1px solid var(--amber);border-radius:var(--radius);color:var(--gold);font-family:'Cinzel',serif;font-size:13px;font-weight:600;letter-spacing:2px;padding:14px 20px;cursor:pointer;transition:all .2s;margin-bottom:10px;text-align:center;}
.btn:hover:not(:disabled){background:linear-gradient(180deg,rgba(212,138,28,.38),rgba(180,115,18,.5));box-shadow:0 0 24px rgba(212,138,28,.28);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.ghost{border-color:rgba(200,184,152,.25);color:var(--muted);background:rgba(0,0,0,.15);}
.btn.ghost:hover:not(:disabled){border-color:rgba(200,184,152,.5);color:var(--cream);background:rgba(255,255,255,.06);}
.btn.danger{border-color:var(--red2);color:#e74c3c;background:rgba(139,26,26,.15);}
.btn.success{border-color:var(--green2);color:#2ecc71;background:rgba(26,74,46,.15);}
.divider{height:1px;background:linear-gradient(90deg,transparent,rgba(212,138,28,.35),transparent);margin:18px 0;}
.code-wrap{background:rgba(0,0,0,.5);border:1px solid rgba(212,138,28,.4);border-radius:var(--radius);padding:16px;text-align:center;margin-bottom:14px;}
.code-lbl{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
.code-val{font-family:'Cinzel',serif;font-size:30px;letter-spacing:10px;color:var(--gold);text-shadow:0 0 20px rgba(240,184,64,.4);}
.link-row{display:flex;gap:6px;align-items:center;background:rgba(0,0,0,.4);border:1px solid rgba(212,138,28,.2);border-radius:var(--radius);padding:9px 12px;margin-bottom:14px;}
.link-row span{flex:1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.link-row button{flex-shrink:0;background:rgba(212,138,28,.18);border:1px solid rgba(212,138,28,.4);border-radius:2px;color:var(--amber);font-family:'Cinzel',serif;font-size:11px;letter-spacing:1px;padding:5px 10px;cursor:pointer;transition:background .2s;}
.link-row button:hover{background:rgba(212,138,28,.38);}
.player-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(0,0,0,.22);border:1px solid rgba(212,138,28,.12);border-radius:var(--radius);margin-bottom:5px;font-size:16px;}
.dot{width:8px;height:8px;border-radius:50%;background:#2ecc71;flex-shrink:0;}
.dot.off{background:#e74c3c;}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(212,138,28,.1);}
.setting-row:last-child{border-bottom:none;}
.counter{display:flex;align-items:center;gap:10px;}
.counter button{width:28px;height:28px;background:rgba(212,138,28,.12);border:1px solid rgba(212,138,28,.35);border-radius:2px;color:var(--amber);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;transition:background .2s;}
.counter button:hover{background:rgba(212,138,28,.3);}
.counter span{color:var(--gold);font-family:'Cinzel',serif;font-size:17px;min-width:22px;text-align:center;}
.target-btn{display:block;width:100%;background:rgba(0,0,0,.2);border:1px solid rgba(200,184,152,.18);border-radius:var(--radius);color:var(--cream);font-family:'Crimson Text',serif;font-size:17px;padding:11px 14px;cursor:pointer;text-align:left;transition:all .15s;margin-bottom:6px;}
.target-btn:hover{background:rgba(212,138,28,.18);border-color:rgba(212,138,28,.5);}
.target-btn.sel{background:rgba(212,138,28,.22);border-color:rgba(212,138,28,.7);}
.italic{font-style:italic;color:var(--muted);line-height:1.7;font-size:16px;}
.alert{padding:10px 14px;border-radius:var(--radius);margin-bottom:12px;font-size:15px;line-height:1.5;}
.alert.err{background:rgba(139,26,26,.2);border:1px solid rgba(192,57,43,.4);color:#e74c3c;}
.alert.info{background:rgba(26,50,74,.3);border:1px solid rgba(41,128,185,.35);color:#5dade2;}
.alert.ok{background:rgba(26,74,46,.3);border:1px solid rgba(39,174,96,.35);color:#2ecc71;}
.candle{display:inline-block;animation:flicker 3s infinite alternate;}
@keyframes flicker{0%,100%{opacity:1}30%{opacity:.85}60%{opacity:.92}80%{opacity:.88}}
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(212,138,28,.25);border-top-color:var(--amber);border-radius:50%;animation:rot .7s linear infinite;vertical-align:middle;}
@keyframes rot{to{transform:rotate(360deg)}}
.fade{animation:fdin .35s ease;}
@keyframes fdin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.tag{display:inline-block;padding:4px 12px;border-radius:2px;font-family:'Cinzel',serif;font-size:13px;letter-spacing:1px;font-weight:600;}
.dead-row{opacity:.3;}
</style>
</head>
<body>
<div id="app"></div>
<script>
const RI={
  Mafia:{e:'🔪',c:'#c0392b',bg:'rgba(139,26,26,.3)'},
  Doctor:{e:'💊',c:'#27ae60',bg:'rgba(26,74,46,.3)'},
  Detective:{e:'🔍',c:'#2980b9',bg:'rgba(26,42,74,.3)'},
  Cupid:{e:'💘',c:'#c0392b',bg:'rgba(120,26,60,.3)'},
  Jester:{e:'🃏',c:'#d35400',bg:'rgba(120,60,0,.3)'},
  Villager:{e:'🏘️',c:'#7f8c8d',bg:'rgba(50,50,60,.3)'},
};
const RDESC={
  Mafia:'Each night, eliminate a villager. Win when Mafia equal or outnumber the town.',
  Doctor:'Each night, protect one player from death. You may protect yourself.',
  Detective:'Each night, investigate someone to learn if they are Mafia.',
  Cupid:'Tonight only: link two souls as lovers. If one dies, the other follows.',
  Jester:'Win by being voted out during the day. Be suspicious, not obvious.',
  Villager:'Find and vote out the Mafia before they take over the village.',
};

// Broker configs tried in order on timeout/error
const PEER_CONFIGS=[
  {host:'0.peerjs.com',port:443,path:'/',secure:true},
  null, // PeerJS default init (same broker, different path)
];

let S={
  screen:'welcome',playerName:'',isHost:false,roomCode:'',
  peer:null,conn:null,conns:{},
  lobbyPlayers:[],settings:{mafia:1,doctor:1,detective:1,cupid:0,jester:0},
  myRole:null,myId:null,
  phase:null,players:[],nightNumber:1,narration:'',loading:false,
  nightDead:[],votedOut:null,winner:null,
  nightActionType:null,nightActionTargets:[],nightActionResult:null,
  cupidPick:[],_detTarget:null,_detName:'',
  _nightQ:[],nightActions:{},lovers:[],voteData:{},
  _rolesReady:0,_totalPlayers:0,
  error:'',
};

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render(){document.getElementById('app').innerHTML=screens();bind();}
function screens(){
  if(S.screen==='welcome')return welcome();
  if(S.screen==='name')return nameScreen();
  if(S.screen==='mode')return mode();
  if(S.screen==='join')return joinInput();
  if(S.screen==='lobby')return lobby();
  if(S.screen==='game')return gameScreen();
  return '';
}

function welcome(){
  return `<div class="page fade">
    <div style="text-align:center;padding:0 24px;max-width:420px;">
      <div style="font-size:56px;margin-bottom:20px;" class="candle">🕯️</div>
      <h1>MAFIA</h1>
      <p class="sub" style="margin-top:10px;max-width:300px;margin-left:auto;margin-right:auto;">
        In a village of secrets, trust no one.<br>The night always takes someone.
      </p>
      <div style="max-width:260px;margin:0 auto;">
        <button class="btn" id="goBtnStart">⚡ START THE GAME</button>
      </div>
    </div>
  </div>`;
}

function nameScreen(){
  const fromLink=!!new URLSearchParams(window.location.search).get('room');
  return `<div class="page fade">
    <div class="card" style="max-width:360px;">
      <div style="text-align:center;margin-bottom:22px;">
        <div style="font-size:38px;margin-bottom:10px;">📜</div>
        <h2>Who Are You?</h2>
        <p class="sub" style="margin-bottom:0;font-size:15px;">Enter your name to take a seat at the table</p>
      </div>
      ${S.error?`<div class="alert err">${S.error}</div>`:''}
      <input type="text" id="inp-name" placeholder="Your name…" value="${S.playerName}" maxlength="18" autocomplete="off">
      <button class="btn" id="goBtnNameNext">TAKE MY SEAT →</button>
      ${!fromLink?`<button class="btn ghost" id="goBtnBackWelcome">← Back</button>`:''}
    </div>
  </div>`;
}

function mode(){
  return `<div class="page fade">
    <div class="card" style="max-width:380px;">
      <div style="text-align:center;margin-bottom:26px;">
        <div style="font-size:38px;margin-bottom:10px;">🏚️</div>
        <h2>The Village</h2>
        <p class="sub" style="margin-bottom:0;font-size:15px;">
          Welcome, <strong style="color:var(--gold)">${esc(S.playerName)}</strong>. What brings you here?
        </p>
      </div>
      ${S.error?`<div class="alert err">${S.error}</div>`:''}
      ${S.loading
        ?`<div style="text-align:center;padding:20px 0;">
            <span class="spin"></span>
            <p style="color:var(--muted);margin-top:14px;font-style:italic;">Preparing the village…</p>
            <p style="color:var(--muted);font-size:13px;margin-top:6px;">Connecting to game server…</p>
          </div>`
        :`<button class="btn" id="goBtnCreate">🏠 CREATE A ROOM</button>
          <div class="divider"></div>
          <button class="btn ghost" id="goBtnJoin">🚪 JOIN A ROOM</button>`
      }
    </div>
  </div>`;
}

function joinInput(){
  return `<div class="page fade">
    <div class="card" style="max-width:360px;">
      <div style="text-align:center;margin-bottom:22px;">
        <div style="font-size:38px;margin-bottom:10px;">🚪</div>
        <h2>Join a Room</h2>
        <p class="sub" style="margin-bottom:0;font-size:15px;">Enter the room code from the host</p>
      </div>
      ${S.error?`<div class="alert err">${S.error}</div>`:''}
      <input type="text" id="inp-code" placeholder="ROOM CODE" value="${S.roomCode||''}"
        maxlength="6" autocomplete="off"
        style="text-align:center;font-size:26px;letter-spacing:8px;text-transform:uppercase;">
      ${S.loading
        ?`<div style="text-align:center;padding:14px;"><span class="spin"></span> <span style="color:var(--muted);vertical-align:middle;margin-left:8px;">Connecting…</span></div>`
        :`<button class="btn" id="goBtnJoinConnect">→ ENTER THE VILLAGE</button>`}
      <button class="btn ghost" id="goBtnBackMode">← Back</button>
    </div>
  </div>`;
}

function lobby(){
  const players=S.lobbyPlayers;
  const link=`${location.origin}${location.pathname}?room=${S.roomCode}`;
  return `<div class="page fade">
    <div class="card">
      <div style="text-align:center;margin-bottom:18px;">
        <div style="font-size:34px;margin-bottom:8px;">🏚️</div>
        <h2>The Tavern</h2>
        <p style="font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:2px;">
          ${S.isHost?'YOU ARE THE INNKEEPER':'WAITING FOR INNKEEPER TO START'}
        </p>
      </div>
      <div class="code-wrap">
        <div class="code-lbl">Room Code</div>
        <div class="code-val">${S.roomCode}</div>
      </div>
      <div class="link-row">
        <span>${link}</span>
        <button id="goBtnCopyLink">COPY</button>
      </div>
      <div class="divider"></div>
      <h3>👥 PLAYERS (${players.length})</h3>
      ${players.map(p=>`
        <div class="player-row">
          <div class="dot${p.connected===false?' off':''}"></div>
          <span style="flex:1;font-size:17px;">${esc(p.name)}</span>
          ${p.isHost?'<span style="color:var(--amber);font-size:13px;">👑 HOST</span>':''}
        </div>`).join('')}
      ${players.length<4?`<div class="alert info" style="margin-top:10px;">Need ${4-players.length} more player${4-players.length!==1?'s':''} to start.</div>`:''}
      ${S.isHost?`
        <div class="divider"></div>
        <h3>⚙️ ROLES</h3>
        <div style="margin-bottom:18px;">
          ${['mafia','doctor','detective','cupid','jester'].map(r=>`
          <div class="setting-row">
            <span style="font-size:15px;color:var(--muted);">${RI[cap(r)]?.e} ${cap(r)}</span>
            <div class="counter">
              <button onclick="adjSetting('${r}',-1)">−</button>
              <span id="sval-${r}">${S.settings[r]}</span>
              <button onclick="adjSetting('${r}',1)">+</button>
            </div>
          </div>`).join('')}
        </div>
        ${S.error?`<div class="alert err">${S.error}</div>`:''}
        <button class="btn" id="goBtnHostStart" ${players.length<4?'disabled':''}>🕯️ BEGIN THE NIGHT</button>
      `:`
        <div class="divider"></div>
        <div style="text-align:center;padding:12px 0;">
          <span class="spin"></span>
          <p style="color:var(--muted);margin-top:12px;font-style:italic;">The innkeeper prepares the roles…</p>
        </div>
      `}
    </div>
  </div>`;
}

function gameScreen(){
  if(S.phase==='roleReveal')return roleReveal();
  if(S.phase==='night')return nightWait();
  if(S.phase==='nightAction')return nightAction();
  if(S.phase==='day')return dayPhase();
  if(S.phase==='vote')return votePh();
  if(S.phase==='voteResult')return voteResult();
  if(S.phase==='over')return gameOver();
  return `<div class="page"><div class="card"><div style="text-align:center"><span class="spin"></span></div></div></div>`;
}

function roleReveal(){
  const r=S.myRole;const ri=RI[r]||RI.Villager;
  const mafPals=S.players.filter(p=>p.role==='Mafia'&&p.id!==S.myId);
  return `<div class="page fade">
    <div class="card" style="text-align:center;">
      <p style="font-size:11px;letter-spacing:3px;color:var(--muted);margin-bottom:14px;">YOUR SECRET ROLE</p>
      <div style="font-size:68px;margin-bottom:14px;">${ri.e}</div>
      <div style="margin-bottom:18px;">
        <span class="tag" style="background:${ri.bg};border:1px solid ${ri.c};color:${ri.c};">${r.toUpperCase()}</span>
      </div>
      <p class="italic" style="margin-bottom:18px;">${RDESC[r]||''}</p>
      ${r==='Mafia'&&mafPals.length>0?`
        <div style="background:rgba(139,26,26,.2);border:1px solid rgba(192,57,43,.3);border-radius:3px;padding:12px;margin-bottom:18px;">
          <p style="font-size:11px;letter-spacing:2px;color:#e74c3c;margin-bottom:8px;">YOUR MAFIA ALLIES:</p>
          ${mafPals.map(p=>`<p style="font-size:16px;">🔪 ${esc(p.name)}</p>`).join('')}
        </div>`:''}
      <p style="font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:14px;">🤫 KEEP THIS SECRET</p>
      <button class="btn" id="goBtnRoleReady">I UNDERSTAND MY ROLE →</button>
    </div>
  </div>`;
}

function nightWait(){
  return `<div class="page fade">
    <div class="card" style="text-align:center;">
      <div style="font-size:52px;margin-bottom:14px;" class="candle">🌑</div>
      <h2>Night ${S.nightNumber}</h2>
      <p class="italic" style="margin-bottom:20px;">
        ${S.loading?'<span class="spin"></span>':S.narration?`❝${S.narration}❞`:'The village falls into a deep silence…'}
      </p>
      <div class="divider"></div>
      <p style="font-size:12px;letter-spacing:2px;color:var(--muted);">THE VILLAGE SLEEPS…</p>
      <p style="font-size:14px;color:var(--muted);margin-top:10px;font-style:italic;">Those with special roles are being called upon.</p>
    </div>
  </div>`;
}

function nightAction(){
  const type=S.nightActionType,targets=S.nightActionTargets,res=S.nightActionResult;
  const info={
    'mafia-kill':{icon:'🔪',title:'MAFIA AWAKENS',inst:'Choose your victim for tonight:'},
    'doctor-protect':{icon:'💊',title:'DOCTOR AWAKENS',inst:'Who will you protect tonight?'},
    'detective-investigate':{icon:'🔍',title:'DETECTIVE AWAKENS',inst:'Investigate someone:'},
    'cupid-link':{icon:'💘',title:'CUPID AWAKENS',inst:`Link two souls as lovers (${S.cupidPick.length}/2):`},
  };
  const {icon,title,inst}=info[type]||{icon:'❓',title:'',inst:''};
  return `<div class="page fade">
    <div class="card">
      <div style="text-align:center;margin-bottom:18px;">
        <div style="font-size:46px;margin-bottom:10px;">${icon}</div>
        <p style="font-size:11px;letter-spacing:3px;color:var(--amber);margin-bottom:6px;">${title}</p>
        <p class="italic">${inst}</p>
      </div>
      ${type==='detective-investigate'&&res!==null?`
        <div style="text-align:center;padding:18px 0;">
          <div style="font-size:42px;margin-bottom:10px;">${res?'🔴':'🟢'}</div>
          <p style="font-size:18px;font-weight:600;color:${res?'#e74c3c':'#2ecc71'}">
            ${esc(S._detName||'')} is ${res?'MAFIA!':'not Mafia.'}
          </p>
          <p style="color:var(--muted);font-size:14px;margin-top:8px;font-style:italic;">Your knowledge, your burden.</p>
          <button class="btn" id="goBtnDetConfirm" style="max-width:260px;margin:18px auto 0;">Understood →</button>
        </div>
      `:`
        ${targets.map(p=>`
          <button class="target-btn${type==='cupid-link'&&S.cupidPick.includes(p.id)?' sel':''}" data-act-id="${p.id}">
            ${type==='cupid-link'?(S.cupidPick.includes(p.id)?'❤️':'○'):'○'} ${esc(p.name)}
          </button>`).join('')}
        ${type==='cupid-link'&&S.cupidPick.length===2?`<button class="btn" id="goBtnCupidConfirm" style="margin-top:8px;">💘 LINK THESE SOULS →</button>`:''}
      `}
    </div>
  </div>`;
}

function dayPhase(){
  const alive=S.players.filter(p=>p.alive);
  return `<div class="page fade">
    <div class="card">
      <div style="text-align:center;margin-bottom:14px;">
        <div style="font-size:46px;margin-bottom:8px;">☀️</div>
        <h2>Day ${S.nightNumber}</h2>
        <p class="italic">${S.loading?'<span class="spin"></span>':S.narration?`❝${S.narration}❞`:''}</p>
      </div>
      ${S.nightDead.length>0?`
        <div style="background:rgba(139,26,26,.2);border:1px solid rgba(192,57,43,.3);border-radius:3px;padding:12px;margin-bottom:14px;">
          <p style="font-size:11px;letter-spacing:2px;color:#e74c3c;margin-bottom:8px;">⚰️ FOUND DEAD AT DAWN:</p>
          ${S.nightDead.map(d=>`
            <div style="display:flex;justify-content:space-between;align-items:center;padding:3px 0;">
              <span>${esc(d.name)}</span>
              <span style="font-size:13px;color:var(--muted);">was ${d.role||'unknown'}</span>
            </div>`).join('')}
        </div>`
      :`<div class="alert ok" style="margin-bottom:14px;">😌 No one died last night.</div>`}

// ─── BIND ─────────────────────────────────────────────────────────────────────
function bind(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',fn);};
  on('goBtnStart',()=>{S.screen='name';S.error='';render();});
  on('goBtnBackWelcome',()=>{S.screen='welcome';render();});
  on('goBtnNameNext',()=>{
    const v=document.getElementById('inp-name')?.value.trim();
    if(!v){S.error='Please enter your name.';render();return;}
    S.playerName=v;S.error='';
    const fromLink=new URLSearchParams(location.search).get('room');
    if(fromLink){S.roomCode=fromLink.toUpperCase();S.screen='join';}
    else S.screen='mode';
    render();
  });
  on('goBtnBackMode',()=>{S.screen='mode';S.error='';S.loading=false;render();});
  on('goBtnCreate',createRoom);
  on('goBtnJoin',()=>{S.screen='join';S.error='';render();});
  on('goBtnJoinConnect',doJoin);
  on('goBtnCopyLink',()=>{
    const link=`${location.origin}${location.pathname}?room=${S.roomCode}`;
    navigator.clipboard.writeText(link).then(()=>{
      const b=document.getElementById('goBtnCopyLink');
      if(b){b.textContent='✓ COPIED';setTimeout(()=>{const bb=document.getElementById('goBtnCopyLink');if(bb)bb.textContent='COPY';},2000);}
    }).catch(()=>{prompt('Copy this link:',link);});
  });
  on('goBtnHostStart',hostStartGame);
  on('goBtnRoleReady',()=>{
    if(S.isHost){
      S._rolesReady++;
      S.phase='night';S.loading=true;render();
      checkAllRolesReady();
    }else{
      S.conn.send({type:'role-seen'});
      S.phase='night';S.loading=true;render();
    }
  });
  on('goBtnDetConfirm',()=>{sendNightAction(S.nightActionType,S._detTarget);});
  on('goBtnCupidConfirm',()=>{if(S.cupidPick.length===2)sendNightAction('cupid-link',S.cupidPick);});
  on('goBtnBeginVote',()=>{if(S.isHost)hostBeginVoting();});
  on('goBtnNextNight',()=>{if(S.isHost){S.nightNumber++;hostBeginNight();}});
  on('goBtnPlayAgain',()=>{location.href=location.pathname;});

  const ni=document.getElementById('inp-name');
  if(ni){ni.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goBtnNameNext')?.click();});setTimeout(()=>ni.focus(),60);}
  const ci=document.getElementById('inp-code');
  if(ci){ci.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goBtnJoinConnect')?.click();});
    ci.addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});
    setTimeout(()=>ci.focus(),60);}

  document.querySelectorAll('[data-act-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.actId;
      if(S.nightActionType==='cupid-link'){
        if(S.cupidPick.includes(id))S.cupidPick=S.cupidPick.filter(x=>x!==id);
        else if(S.cupidPick.length<2)S.cupidPick.push(id);
        render();
      }else if(S.nightActionType==='detective-investigate'){
        const t=S.nightActionTargets.find(p=>p.id===id);
        S.nightActionResult=t?.isMafia||false;
        S._detName=t?.name||'';
        S._detTarget=id;
        render();
      }else{
        sendNightAction(S.nightActionType,id);
      }
    });
  });

  document.querySelectorAll('[data-vote-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.voteId==='__skip__'?null:btn.dataset.voteId;
      submitVote(id);
    });
  });
}

// ─── PEER / NETWORK ───────────────────────────────────────────────────────────
function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;
}

function createRoom(retryCount,cfgIdx){
  retryCount=retryCount||0;cfgIdx=cfgIdx||0;
  const code=genCode();
  S.roomCode=code;S.isHost=true;S.myId='host';
  S.loading=true;S.error='';
  history.replaceState(null,'',location.pathname+'?room='+code);
  render(); // show spinner — no more silent freeze

  if(S.peer){try{S.peer.destroy();}catch(e){}}

  const cfg=PEER_CONFIGS[cfgIdx%PEER_CONFIGS.length];
  S.peer=cfg?new Peer('maf-'+code.toLowerCase(),cfg):new Peer('maf-'+code.toLowerCase());

  // Hard 10-second timeout
  const tid=setTimeout(()=>{
    if(!S.loading)return;
    try{S.peer.destroy();}catch(e){}
    if(cfgIdx<PEER_CONFIGS.length-1){
      createRoom(retryCount,cfgIdx+1); // try next broker config
    }else{
      S.loading=false;
      S.error='Could not reach game server. Check your connection and try again.';
      render();
    }
  },10000);

  S.peer.on('open',()=>{
    clearTimeout(tid);
    S.loading=false;
    S.lobbyPlayers=[{id:'host',name:S.playerName,isHost:true,connected:true}];
    S.screen='lobby';render();
  });
  S.peer.on('error',err=>{
    clearTimeout(tid);
    if(err.type==='unavailable-id'&&retryCount<5){createRoom(retryCount+1,cfgIdx);return;}
    if((err.type==='network'||err.type==='server-error')&&cfgIdx<PEER_CONFIGS.length-1){createRoom(retryCount,cfgIdx+1);return;}
    S.loading=false;
    S.error='Connection error ('+(err.type||'unknown')+'). Try refreshing.';
    render();
  });
  S.peer.on('connection',conn=>{
    conn.on('open',()=>{
      S.conns[conn.peer]=conn;
      conn.on('data',msg=>hostOnMsg(conn,msg));
      conn.on('close',()=>{
        const p=S.lobbyPlayers.find(x=>x.id===conn.peer);
        if(p)p.connected=false;
        delete S.conns[conn.peer];
        if(S.screen==='lobby')render();
      });
    });
  });
}

function doJoin(){
  const code=(document.getElementById('inp-code')?.value||'').trim().toUpperCase();
  if(!code||code.length<4){S.error='Please enter a valid room code.';render();return;}
  S.roomCode=code;S.isHost=false;S.loading=true;S.error='';render();

  if(S.peer){try{S.peer.destroy();}catch(e){}}

  const cfg=PEER_CONFIGS[0];
  S.peer=cfg?new Peer(cfg):new Peer();

  const tid=setTimeout(()=>{
    if(!S.loading)return;
    try{S.peer.destroy();}catch(e){}
    S.loading=false;S.error='Could not reach game server. Check your connection.';S.screen='join';render();
  },10000);

  S.peer.on('open',()=>{
    S.myId=S.peer.id;
    S.conn=S.peer.connect('maf-'+code.toLowerCase(),{reliable:true});
    const ctid=setTimeout(()=>{
      if(S.loading){S.loading=false;S.error='Could not connect. Check the room code.';S.screen='join';render();}
    },8000);
    S.conn.on('open',()=>{
      clearTimeout(tid);clearTimeout(ctid);
      S.loading=false;
      S.conn.send({type:'join',name:S.playerName});
      S.screen='lobby';render();
    });
    S.conn.on('data',msg=>guestOnMsg(msg));
    S.conn.on('close',()=>{
      if(S.phase!=='over'){S.error='Lost connection to host.';S.screen='join';S.loading=false;render();}
    });
    S.conn.on('error',()=>{clearTimeout(tid);clearTimeout(ctid);S.error='Could not connect. Check the room code.';S.loading=false;S.screen='join';render();});
  });
  S.peer.on('error',err=>{clearTimeout(tid);S.error='Connection failed: '+(err.message||err.type||'unknown');S.loading=false;S.screen='join';render();});
}

function broadcast(msg){Object.values(S.conns).forEach(c=>{try{c.send(msg);}catch(e){}});}
function broadcastLobby(){broadcast({type:'lobby',players:S.lobbyPlayers,settings:S.settings});}

// ─── HOST MSG ─────────────────────────────────────────────────────────────────
function hostOnMsg(conn,msg){
  if(msg.type==='join'){
    const id=conn.peer;
    const ex=S.lobbyPlayers.find(p=>p.id===id);
    if(ex){ex.connected=true;ex.name=msg.name;}
    else S.lobbyPlayers.push({id,name:msg.name,isHost:false,connected:true});
    broadcastLobby();render();
  }else if(msg.type==='role-seen'){
    S._rolesReady++;checkAllRolesReady();
  }else if(msg.type==='night-action'){
    hostProcessAction(conn.peer,msg.actionType,msg.target);
  }else if(msg.type==='vote'){
    hostProcessVote(conn.peer,msg.targetId);
  }
}

function checkAllRolesReady(){
  if(S._rolesReady>=S._totalPlayers){S._rolesReady=0;hostBeginNight();}
}

// ─── GUEST MSG ────────────────────────────────────────────────────────────────
function guestOnMsg(msg){
  if(msg.type==='lobby'){S.lobbyPlayers=msg.players;S.settings=msg.settings;S.screen='lobby';render();}
  else if(msg.type==='game-start'){S.myRole=msg.role;S.players=msg.players;S.phase='roleReveal';S.screen='game';render();}
  else if(msg.type==='night-begin'){S.nightNumber=msg.nightNumber;S.phase='night';S.narration='';S.loading=true;render();}
  else if(msg.type==='night-start'){S.phase='night';S.narration=msg.narration||'';S.loading=false;S.nightNumber=msg.nightNumber||S.nightNumber;S.nightActionType=null;S.nightActionResult=null;S.cupidPick=[];render();}
  else if(msg.type==='your-turn'){S.phase='nightAction';S.nightActionType=msg.actionType;S.nightActionTargets=msg.targets;S.nightActionResult=null;S.cupidPick=[];render();}
  else if(msg.type==='day-start'){S.phase='day';S.nightDead=msg.dead;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.nightNumber=msg.nightNumber;render();}
  else if(msg.type==='vote-start'){S.phase='vote';S.voteData={};S.players=msg.players;render();}
  else if(msg.type==='vote-result'){S.phase='voteResult';S.votedOut=msg.eliminated;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.winner=msg.winner||null;render();}
  else if(msg.type==='game-over'){S.phase='over';S.winner=msg.winner;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.screen='game';render();}
}

// ─── GAME LOGIC (HOST) ────────────────────────────────────────────────────────
async function hostStartGame(){
  const pl=S.lobbyPlayers;
  if(pl.length<4){S.error='Need at least 4 players!';render();return;}
  const cfg=S.settings;
  const spec=cfg.mafia+cfg.doctor+cfg.detective+cfg.cupid+cfg.jester;
  if(spec>pl.length){S.error='Too many special roles for this player count!';render();return;}
  const roles=[];
  for(let i=0;i<cfg.mafia;i++)roles.push('Mafia');
  if(cfg.doctor)roles.push('Doctor');
  if(cfg.detective)roles.push('Detective');
  if(cfg.cupid)roles.push('Cupid');
  if(cfg.jester)roles.push('Jester');
  while(roles.length<pl.length)roles.push('Villager');
  const shuffled=shuffle(roles);
  S.players=pl.map((p,i)=>({id:p.id,name:p.name,role:shuffled[i],alive:true}));
  S.lovers=[];S.nightNumber=1;S.nightActions={};
  S._totalPlayers=pl.length;S._rolesReady=0;
  S.players.forEach(player=>{
    const visPlayers=S.players.map(p=>({
      id:p.id,name:p.name,alive:p.alive,
      role:(p.id===player.id||(player.role==='Mafia'&&p.role==='Mafia'))?p.role:undefined
    }));
    const gmsg={type:'game-start',role:player.role,players:visPlayers};
    if(player.id==='host'){S.myRole=player.role;S.screen='game';S.phase='roleReveal';}
    else S.conns[player.id]?.send(gmsg);
  });
  render();
}

async function hostBeginNight(){
  S.nightActions={};S._nightQ=[];S.phase='night';S.loading=true;render();
  broadcast({type:'night-begin',nightNumber:S.nightNumber});
  const t=await callGM(`Mafia Game Master. Night ${S.nightNumber} begins. One short chilling sentence about darkness falling on the village.`);
  S._nightNarration=t;S.narration=t;S.loading=false;
  broadcast({type:'night-start',narration:t,nightNumber:S.nightNumber});
  render();buildAndRunNightQueue();
}

function buildAndRunNightQueue(){
  const alive=S.players.filter(p=>p.alive);const q=[];
  if(S.nightNumber===1){const c=alive.find(p=>p.role==='Cupid');if(c)q.push(c);}
  const mafia=alive.filter(p=>p.role==='Mafia');if(mafia.length>0)q.push(mafia[0]);
  const doc=alive.find(p=>p.role==='Doctor');if(doc)q.push(doc);
  const det=alive.find(p=>p.role==='Detective');if(det)q.push(det);
  S._nightQ=[...q];runNextNightActor();
}

function runNextNightActor(){
  if(!S._nightQ||S._nightQ.length===0){hostResolveNight();return;}
  const actor=S._nightQ.shift();S._curActor=actor;
  const alive=S.players.filter(p=>p.alive);const others=alive.filter(p=>p.id!==actor.id);
  let actionType='';let targets=[];
  if(actor.role==='Cupid'){actionType='cupid-link';targets=alive.map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Mafia'){actionType='mafia-kill';targets=others.filter(p=>p.role!=='Mafia').map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Doctor'){actionType='doctor-protect';targets=alive.map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Detective'){actionType='detective-investigate';targets=others.map(p=>({id:p.id,name:p.name,isMafia:p.role==='Mafia'}));}
  if(actor.id==='host'){
    S.phase='nightAction';S.nightActionType=actionType;S.nightActionTargets=targets;S.nightActionResult=null;S.cupidPick=[];render();
  }else{
    S.conns[actor.id]?.send({type:'your-turn',actionType,targets});S.phase='night';render();
  }
}

function sendNightAction(actionType,target){
  if(S.isHost){hostProcessAction('host',actionType,target);S.phase='night';render();}
  else{S.conn.send({type:'night-action',actionType,target});S.phase='night';S.nightActionType=null;render();}
}

function hostProcessAction(actorId,actionType,target){
  if(actionType==='mafia-kill')S.nightActions.mafiaTarget=target;
  else if(actionType==='doctor-protect')S.nightActions.doctorTarget=target;
  else if(actionType==='detective-investigate')S.nightActions.detectiveTarget=target;
  else if(actionType==='cupid-link'){
    S.nightActions.cupidTargets=Array.isArray(target)?target:[target];
    S.lovers=S.nightActions.cupidTargets;
    S.players=S.players.map(p=>({...p,isLover:S.lovers.includes(p.id)}));
  }
  runNextNightActor();
}

async function hostResolveNight(){
  const na=S.nightActions;let dead=[];
  if(na.mafiaTarget&&na.mafiaTarget!==na.doctorTarget){
    const t=S.players.find(p=>p.id===na.mafiaTarget&&p.alive);if(t)dead.push(t);
  }
  const seen=new Set(dead.map(d=>d.id));let chg=true;
  while(chg){chg=false;[...dead].forEach(d=>{if(S.lovers.includes(d.id)){S.lovers.forEach(lid=>{if(lid!==d.id&&!seen.has(lid)){const p=S.players.find(x=>x.id===lid&&x.alive);if(p){dead.push(p);seen.add(lid);chg=true;}}});}}); }
  const deadSet=new Set(dead.map(d=>d.id));
  S.players=S.players.map(p=>({...p,alive:deadSet.has(p.id)?false:p.alive}));
  S.nightDead=dead;S.nightActions={};S.loading=true;render();
  const w=checkWin(S.players);
  const prompt=dead.length===0
    ?`Mafia Game Master. Night ${S.nightNumber}: Doctor saved the target. One eerie sentence about a peaceful dawn.`
    :`Mafia Game Master. Night ${S.nightNumber}: Found dead at dawn: ${dead.map(d=>d.name).join(', ')}. 2 atmospheric sentences.`;
  const t=await callGM(prompt);S.narration=t;S.loading=false;
  if(w){await hostEndGame(w);return;}
  const dayMsg={type:'day-start',dead:dead.map(d=>({id:d.id,name:d.name,role:d.role})),narration:t,players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive})),nightNumber:S.nightNumber};
  broadcast(dayMsg);S.phase='day';render();
}

function hostBeginVoting(){
  const alive=S.players.filter(p=>p.alive);
  S.voteData={};S._voteExpected=alive.length;
  broadcast({type:'vote-start',players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive}))});
  S.phase='vote';render();
}

function submitVote(targetId){
  const voteVal=targetId===null?'__abstain__':targetId;
  S.voteData[S.myId]=voteVal;render();
  if(S.isHost)hostProcessVote('host',targetId);
  else S.conn.send({type:'vote',targetId});
}

function hostProcessVote(voterId,targetId){
  const voteVal=targetId===null?'__abstain__':targetId;
  S.voteData[voterId]=voteVal;
  const alive=S.players.filter(p=>p.alive);
  const cast=alive.filter(p=>S.voteData.hasOwnProperty(p.id)).length;
  if(cast>=alive.length)hostResolveVote();
}

async function hostResolveVote(){
  const alive=S.players.filter(p=>p.alive);const counts={};
  alive.forEach(p=>{const v=S.voteData[p.id];if(v&&v!=='__abstain__')counts[v]=(counts[v]||0)+1;});
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  let elim=null;
  if(sorted.length>0&&(sorted.length===1||sorted[0][1]>sorted[1][1]))elim=S.players.find(p=>p.id===sorted[0][0]);
  if(elim){
    S.players=S.players.map(p=>({...p,alive:p.id===elim.id?false:p.alive}));
    if(S.lovers.includes(elim.id))S.lovers.forEach(lid=>{if(lid!==elim.id)S.players=S.players.map(p=>({...p,alive:p.id===lid?false:p.alive}));});
  }
  S.votedOut=elim||null;S.loading=true;render();
  const w=checkWin(S.players,elim);
  const t=await callGM(elim
    ?`Mafia game. Day vote: ${elim.name} (${elim.role}) was eliminated. 2 dramatic atmospheric sentences.`
    :`Mafia game. Day vote tied — no elimination. One tense sentence about the unresolved tension.`);
  S.narration=t;S.loading=false;
  if(w){await hostEndGame(w);return;}
  broadcast({type:'vote-result',eliminated:elim?{id:elim.id,name:elim.name,role:elim.role}:null,narration:t,players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive})),winner:null});
  S.phase='voteResult';render();
}

async function hostEndGame(winner){
  S.winner=winner;S.loading=true;S.phase='over';render();
  const t=await callGM(`Mafia party game: ${winner} won. 2 dramatic climactic sentences as the final announcement.`);
  S.narration=t;S.loading=false;
  broadcast({type:'game-over',winner,narration:t,players:S.players});render();
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function checkWin(ps,elim=null){
  if(elim?.role==='Jester')return'Jester';
  const aM=ps.filter(p=>p.alive&&p.role==='Mafia').length;
  const aT=ps.filter(p=>p.alive&&p.role!=='Mafia'&&p.role!=='Jester').length;
  if(aM===0)return'Town';if(aM>=aT)return'Mafia';return null;
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

async function callGM(prompt){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    if(d.content&&d.content[0]&&d.content[0].text)return d.content[0].text;
    return'The village stirs in uneasy silence…';
  }catch{return'The village stirs in uneasy silence…';}
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

// ─── INIT ──────────────────────────────────────────────────────────────────────
const urlRoom=new URLSearchParams(location.search).get('room');
if(urlRoom){S.roomCode=urlRoom.toUpperCase();S.screen='name';}
render();
</script>
