 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MAFIA</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root {
  --bg:      #070a0f;
  --bg2:     #0d1117;
  --panel:   #111822;
  --panel2:  #161f2e;
  --border:  rgba(255,255,255,.07);
  --border2: rgba(255,255,255,.12);
  --red:     #e8213a;
  --red2:    #ff3d57;
  --cyan:    #00d4ff;
  --cyan2:   #6ee7ff;
  --gold:    #f5c842;
  --green:   #00e676;
  --purple:  #9b59ff;
  --text:    #e8eaf0;
  --muted:   #5a6478;
  --muted2:  #8a95aa;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html,body{
  height:100%; background:var(--bg);
  color:var(--text); font-family:'Rajdhani',sans-serif;
  font-size:16px; overflow-x:hidden;
}

/* ── ANIMATED BG GRID ── */
#bg{
  position:fixed;inset:0;z-index:0;
  background-image:
    linear-gradient(rgba(0,212,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,212,255,.025) 1px, transparent 1px);
  background-size:48px 48px;
  animation:gridMove 20s linear infinite;
}
@keyframes gridMove{from{background-position:0 0;}to{background-position:48px 48px;}}

/* ── VIGNETTE ── */
#bg::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center, transparent 30%, var(--bg) 80%);
}

/* ── PARTICLES ── */
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;}

/* ── APP ── */
#app{position:relative;z-index:2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}

/* ── CURTAIN ── */
#curtain{position:fixed;inset:0;background:var(--bg);z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s;}
#curtain.show{opacity:1;}

/* ══ CARD ══ */
.card{
  background:var(--panel);
  border:1px solid var(--border2);
  border-radius:12px;
  padding:28px 24px;
  width:100%;max-width:480px;
  position:relative;
  overflow:hidden;
  box-shadow:0 0 60px rgba(0,212,255,.06), 0 24px 48px rgba(0,0,0,.6);
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg, transparent, var(--cyan), transparent);
  animation:scanLine 3s ease-in-out infinite;
}
@keyframes scanLine{
  0%,100%{opacity:.4;transform:scaleX(.3);left:-30%;}
  50%{opacity:1;transform:scaleX(1);left:0;}
}

/* ══ LOGO ══ */
.logo{
  text-align:center;margin-bottom:24px;position:relative;
}
.logo-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(52px,14vw,80px);
  letter-spacing:8px;
  background:linear-gradient(135deg, var(--red2), var(--red), #ff8a00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 0 20px rgba(232,33,58,.5));
  line-height:1;
}
.logo-sub{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:4px;color:var(--muted2);
  text-transform:uppercase;margin-top:4px;
}
.logo-rule{
  display:flex;align-items:center;gap:10px;margin-top:10px;
}
.logo-rule::before,.logo-rule::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(90deg, transparent, var(--border2));
}
.logo-rule::before{background:linear-gradient(90deg, transparent, var(--border2));}
.logo-rule::after{background:linear-gradient(90deg, var(--border2), transparent);}

/* ══ BUTTONS ══ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:14px 20px;
  background:linear-gradient(135deg, var(--red), #c41530);
  border:none;border-radius:8px;
  color:#fff;font-family:'Bebas Neue',sans-serif;
  font-size:18px;letter-spacing:3px;
  cursor:pointer;transition:all .2s;margin-bottom:10px;
  position:relative;overflow:hidden;
}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent);opacity:0;transition:opacity .2s;}
.btn:hover:not(:disabled)::after{opacity:1;}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 24px rgba(232,33,58,.4);}
.btn:active:not(:disabled){transform:translateY(0);}
.btn:disabled{opacity:.3;cursor:not-allowed;}

.btn.outline{
  background:transparent;
  border:1px solid var(--border2);
  color:var(--muted2);font-size:16px;
}
.btn.outline:hover:not(:disabled){border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 16px rgba(0,212,255,.2);}

.btn.cyan{background:linear-gradient(135deg,#0099cc,#006688);}
.btn.cyan:hover:not(:disabled){box-shadow:0 8px 24px rgba(0,212,255,.4);}
.btn.green{background:linear-gradient(135deg,#00a854,#006633);}
.btn.green:hover:not(:disabled){box-shadow:0 8px 24px rgba(0,230,118,.35);}
.btn.ghost{background:rgba(255,255,255,.05);border:1px solid var(--border2);color:var(--text);font-size:15px;letter-spacing:1px;font-family:'Rajdhani',sans-serif;font-weight:600;}
.btn.ghost:hover:not(:disabled){background:rgba(255,255,255,.09);}
.btn.sm{padding:9px 14px;font-size:14px;letter-spacing:2px;width:auto;margin-bottom:0;}
.btn.danger{background:linear-gradient(135deg,#7a0010,#4a0008);}

/* ══ INPUTS ══ */
.field{margin-bottom:14px;}
.field label{
  display:block;font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:3px;color:var(--muted2);
  text-transform:uppercase;margin-bottom:8px;
}
input[type=text]{
  width:100%;background:rgba(255,255,255,.04);
  border:1px solid var(--border2);border-radius:6px;
  color:var(--text);font-family:'Rajdhani',sans-serif;
  font-size:17px;font-weight:600;padding:12px 14px;
  outline:none;transition:all .2s;letter-spacing:1px;
}
input[type=text]:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,212,255,.1);}
input.code-inp{text-align:center;font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:10px;}
input::placeholder{color:rgba(255,255,255,.12);}

/* ══ SECTION HEAD ══ */
.sec{
  font-family:'Share Tech Mono',monospace;
  font-size:10px;letter-spacing:4px;color:var(--cyan);
  text-transform:uppercase;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;
}
.sec::after{content:'';flex:1;height:1px;background:var(--border);}

/* ══ ALERT ══ */
.alert{
  padding:12px 14px;border-radius:6px;margin-bottom:14px;
  font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.5px;line-height:1.5;
}
.alert.err{background:rgba(232,33,58,.12);border:1px solid rgba(232,33,58,.3);color:#ff8a9a;}
.alert.info{background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);color:var(--cyan2);}
.alert.ok{background:rgba(0,230,118,.08);border:1px solid rgba(0,230,118,.2);color:var(--green);}
.alert.warn{background:rgba(245,200,66,.08);border:1px solid rgba(245,200,66,.2);color:var(--gold);}

/* ══ PLAYER ROWS ══ */
.p-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.p-row{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.03);
  border:1px solid var(--border);border-radius:6px;
  padding:10px 14px;transition:all .25s;
  animation:rowIn .3s ease both;
}
.p-row.dead{opacity:.3;text-decoration:line-through;}
@keyframes rowIn{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:none;}}
.p-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.p-dot.on{background:var(--green);box-shadow:0 0 8px var(--green);}
.p-dot.off{background:var(--red);}
.p-name{flex:1;font-weight:600;font-size:15px;}
.p-badge{
  font-family:'Share Tech Mono',monospace;font-size:9px;
  letter-spacing:2px;text-transform:uppercase;
  background:rgba(255,255,255,.07);border:1px solid var(--border2);
  border-radius:4px;padding:2px 8px;color:var(--muted2);
}
.speak-ring{
  width:24px;height:24px;border-radius:50%;
  border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;transition:all .25s;flex-shrink:0;
}
.speak-ring.active{border-color:var(--green);box-shadow:0 0 10px rgba(0,230,118,.5);animation:speakPulse .8s infinite;}
.speak-ring.hushed{border-color:var(--red);}
@keyframes speakPulse{0%,100%{box-shadow:0 0 6px rgba(0,230,118,.4);}50%{box-shadow:0 0 16px rgba(0,230,118,.8);}}

/* ══ CODE BLOCK ══ */
.code-block{
  background:rgba(0,0,0,.4);border:1px solid var(--border2);
  border-radius:8px;padding:20px;text-align:center;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.code-block::before{
  content:'ROOM CODE';display:block;
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:4px;
  color:var(--muted);text-transform:uppercase;margin-bottom:8px;
}
.code-val{
  font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:16px;
  background:linear-gradient(135deg, var(--cyan), var(--cyan2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;filter:drop-shadow(0 0 10px rgba(0,212,255,.4));
}
.link-row{
  display:flex;gap:6px;align-items:center;
  background:rgba(0,0,0,.3);border:1px solid var(--border);
  border-radius:6px;padding:8px 12px;margin-bottom:14px;
}
.link-row span{flex:1;font-size:11px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Share Tech Mono',monospace;}
.link-row button{flex-shrink:0;background:var(--cyan);border:none;border-radius:4px;color:#000;font-family:'Bebas Neue',sans-serif;font-size:11px;letter-spacing:2px;padding:4px 10px;cursor:pointer;transition:all .2s;}
.link-row button:hover{background:var(--cyan2);}

/* ══ ROLE SETTINGS ══ */
.role-grid{background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px;}
.role-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);}
.role-item:last-child{border-bottom:none;}
.role-item:hover{background:rgba(255,255,255,.03);}
.role-icon{font-size:20px;width:28px;text-align:center;flex-shrink:0;}
.role-label{flex:1;font-weight:600;font-size:15px;}
.counter{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ctr-btn{
  width:28px;height:28px;background:rgba(255,255,255,.08);border:1px solid var(--border2);
  border-radius:4px;color:var(--text);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.ctr-btn:hover{background:rgba(255,255,255,.14);border-color:var(--cyan);}
.ctr-val{font-family:'Bebas Neue',sans-serif;font-size:20px;min-width:22px;text-align:center;color:var(--cyan);}

/* ══ CHOICE LIST ══ */
.choice-list{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;}
.choice-btn{
  display:flex;align-items:center;gap:12px;width:100%;
  background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:6px;
  padding:13px 16px;cursor:pointer;text-align:left;
  font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:600;
  color:var(--text);transition:all .15s;
}
.choice-btn:hover{background:rgba(0,212,255,.07);border-color:rgba(0,212,255,.3);transform:translateX(4px);}
.choice-btn.selected{background:rgba(232,33,58,.15);border-color:var(--red2);color:#fff;}
.choice-btn.selected:hover{background:rgba(232,33,58,.2);}
.choice-marker{width:20px;height:20px;border-radius:50%;border:1.5px solid currentColor;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.5;}
.choice-btn.selected .choice-marker{opacity:1;}

/* ══ DIVIDER ══ */
.div{display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;}
.div::before,.div::after{content:'';flex:1;height:1px;background:var(--border);}

/* ══ SPINNER ══ */
.spin{display:inline-block;width:18px;height:18px;border:2px solid rgba(0,212,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:rot .6s linear infinite;vertical-align:middle;}
@keyframes rot{to{transform:rotate(360deg);}}
.loading{text-align:center;padding:32px 0;}
.loading p{font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--muted2);margin-top:14px;text-transform:uppercase;}

/* ══ PHASE BANNER ══ */
.phase{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:rgba(0,0,0,.5);border:1px solid var(--border2);border-radius:6px;
  padding:8px 16px;margin-bottom:20px;
  font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:4px;
  text-transform:uppercase;color:var(--muted2);
}
.phase.night-p{border-color:rgba(155,89,255,.3);color:var(--purple);}
.phase.day-p{border-color:rgba(245,200,66,.3);color:var(--gold);}
.phase.vote-p{border-color:rgba(232,33,58,.3);color:var(--red2);}

/* ══ ROLE REVEAL ══ */
.role-reveal{text-align:center;padding:16px 0;}
.role-emoji{font-size:72px;display:block;margin-bottom:12px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;filter:drop-shadow(0 0 20px rgba(255,255,255,.2));}
@keyframes popIn{from{transform:scale(.4) translateY(-20px);opacity:0;}to{transform:none;opacity:1;}}
.role-tag{
  display:inline-block;padding:6px 20px;border-radius:20px;
  font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:4px;
  margin-bottom:14px;
}
.role-tag.mafia{background:linear-gradient(135deg,var(--red),#8a0010);box-shadow:0 0 20px rgba(232,33,58,.4);}
.role-tag.doctor{background:linear-gradient(135deg,#00a854,#005522);box-shadow:0 0 20px rgba(0,168,84,.4);}
.role-tag.detective{background:linear-gradient(135deg,#0077cc,#004488);box-shadow:0 0 20px rgba(0,119,204,.4);}
.role-tag.cupid{background:linear-gradient(135deg,#cc2255,#880033);box-shadow:0 0 20px rgba(204,34,85,.4);}
.role-tag.jester{background:linear-gradient(135deg,#886600,#553300);box-shadow:0 0 16px rgba(136,102,0,.4);}
.role-tag.civilian{background:linear-gradient(135deg,#334455,#1a2233);box-shadow:0 0 16px rgba(0,212,255,.2);}

/* ══ OBITUARY ══ */
.obit{background:rgba(232,33,58,.07);border:1px solid rgba(232,33,58,.2);border-radius:8px;padding:12px 14px;margin-bottom:14px;}
.obit-head{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--red2);margin-bottom:10px;}
.obit-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px;font-weight:600;}
.obit-row:last-child{border-bottom:none;}

/* ══ VOTE BARS ══ */
.vtally{margin-bottom:14px;}
.vtally-head{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--muted);margin-bottom:10px;text-transform:uppercase;}
.v-entry{margin-bottom:8px;}
.v-entry-label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px;}
.v-track{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;}
.v-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--red2));border-radius:3px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}

/* ══ WINNER ══ */
.winner-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(36px,10vw,60px);letter-spacing:4px;text-align:center;
  margin-bottom:8px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;
}
.winner-title.town{background:linear-gradient(135deg,var(--green),#00a854);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 16px rgba(0,230,118,.6));}
.winner-title.mafia{background:linear-gradient(135deg,var(--red2),#ff8a00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 16px rgba(232,33,58,.6));}
.winner-title.jester{background:linear-gradient(135deg,var(--gold),#ff8800);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;filter:drop-shadow(0 0 16px rgba(245,200,66,.6));}

/* ══ NIGHT BIG NUM ══ */
.night-num{
  position:absolute;bottom:8px;right:14px;
  font-family:'Bebas Neue',sans-serif;font-size:90px;color:rgba(155,89,255,.06);
  pointer-events:none;user-select:none;line-height:1;
}

/* ══ VOICE BAR ══ */
#vbar{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(13,17,23,.95);border:1px solid var(--border2);
  border-radius:40px;padding:8px 16px;
  display:flex;align-items:center;gap:12px;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
  transform:translateX(-50%) translateY(8px);white-space:nowrap;
}
#vbar.show{opacity:1;pointer-events:all;transform:translateX(-50%) translateY(0);}
#vbar .vbl{font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:3px;color:var(--muted);}
#vbar .vbl.on{color:var(--green);}#vbar .vbl.muted{color:var(--red);}
.vbtn{background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text);transition:all .2s;}
.vbtn:hover{background:rgba(255,255,255,.14);}
.vbtn.muted{background:rgba(232,33,58,.2);border-color:rgba(232,33,58,.4);}
.mute-btn{background:rgba(255,255,255,.07);border:1px solid var(--border);border-radius:20px;padding:4px 12px;cursor:pointer;font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--muted2);text-transform:uppercase;transition:all .2s;}
.mute-btn:hover{border-color:var(--cyan);color:var(--cyan);}
.mute-btn.active{background:rgba(232,33,58,.2);border-color:var(--red);color:var(--red2);}
.mute-p-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:2px 8px;font-family:'Share Tech Mono',monospace;font-size:8px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted);transition:all .15s;}
.mute-p-btn:hover,.mute-p-btn.muted{border-color:var(--red2);color:var(--red2);}

/* ══ TRANSITIONS ══ */
.fade{animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.pop{animation:popIn .5s cubic-bezier(.34,1.2,.64,1) both;}
.stagger>*{animation:fadeUp .35s ease both;}
.stagger>*:nth-child(1){animation-delay:.04s}
.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.12s}
.stagger>*:nth-child(4){animation-delay:.16s}
.stagger>*:nth-child(5){animation-delay:.20s}
.stagger>*:nth-child(6){animation-delay:.24s}
.stagger>*:nth-child(7){animation-delay:.28s}
.stagger>*:nth-child(8){animation-delay:.32s}

/* ══ TW ══ */
.tw::after{content:'▋';animation:blink 1s infinite;color:var(--cyan);font-size:.85em;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

/* ══ WELCOME ══ */
.welcome-card{
  width:100%;max-width:520px;
  background:var(--panel);
  border:1px solid var(--border2);border-radius:16px;
  overflow:hidden;
  box-shadow:0 0 80px rgba(232,33,58,.1), 0 32px 64px rgba(0,0,0,.7);
}
.welcome-hero{
  padding:48px 32px 32px;text-align:center;position:relative;
  background:linear-gradient(180deg, rgba(232,33,58,.06) 0%, transparent 100%);
}
.welcome-hero::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(232,33,58,.12), transparent 70%);
}
.hero-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(72px,20vw,120px);letter-spacing:12px;
  background:linear-gradient(135deg, var(--red2) 0%, #ff6600 60%, var(--gold) 100%);

</head>
<body>
<div id="bg"></div>
<canvas id="particles"></canvas>
<div id="curtain"></div>
<div id="vbar">
  <button class="vbtn" id="vb-mic">🎤</button>
  <span class="vbl" id="vb-lbl">VOICE</span>
  <button class="mute-btn" id="vb-en">ENABLE MIC</button>
</div>
<div id="app"></div>
<script>
/* ══════════════════════════════════════════════
   PARTICLES
══════════════════════════════════════════════ */
(function(){
  const c=document.getElementById('particles');
  const ctx=c.getContext('2d');
  let W,H,pts=[];
  const resize=()=>{W=c.width=innerWidth;H=c.height=innerHeight;};
  resize();addEventListener('resize',resize);
  for(let i=0;i<60;i++) pts.push({
    x:Math.random()*2000,y:Math.random()*1200,
    r:Math.random()*.8+.2,
    vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.2,
    a:Math.random()*.15+.03,
    col:Math.random()<.6?'0,212,255':'232,33,58'
  });
  function loop(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(d=>{
      d.x=(d.x+d.vx+W)%W;d.y=(d.y+d.vy+H)%H;
      ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(${d.col},${d.a})`;ctx.fill();
    });
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ══════════════════════════════════════════════
   DATA
══════════════════════════════════════════════ */
const ROLES={
  Mafia:    {e:'🔪',label:'mafia'},
  Doctor:   {e:'💊',label:'doctor'},
  Detective:{e:'🔍',label:'detective'},
  Cupid:    {e:'💘',label:'cupid'},
  Jester:   {e:'🃏',label:'jester'},
  Civilian: {e:'🏙️',label:'civilian'},
};
const RDESC={
  Mafia:    'Each night, eliminate a civilian. Win when Mafia equal or outnumber the town.',
  Doctor:   'Each night, protect one person from death. You may protect yourself.',
  Detective:'Each night, investigate someone to learn if they are Mafia.',
  Cupid:    'Tonight only: link two souls as lovers. If one dies, the other follows.',
  Jester:   'Win by getting voted out during the day. Act suspicious — but not too obvious.',
  Civilian: 'Find and vote out the Mafia before they take over the town.',
};

/* ══════════════════════════════════════════════
   STATE
══════════════════════════════════════════════ */
let S={
  screen:'welcome',playerName:'',isHost:false,roomCode:'',
  error:'',loading:false,
  peer:null,conn:null,conns:{},myId:null,
  lobbyPlayers:[],players:[],settings:{mafia:2,doctor:1,detective:1,cupid:0,jester:0},
  phase:'',myRole:'',nightNumber:1,nightDead:[],narration:'',
  nightActions:{},nightActionType:null,nightActionTargets:[],nightActionResult:null,
  cupidPick:[],_nightQ:[],_curActor:null,
  lovers:[],votedOut:null,voteData:{},_voteExpected:0,
  winner:null,_rolesReady:0,_totalPlayers:0,
  voiceEnabled:false,voiceSelfMuted:false,voiceMutedByHost:false,
  voiceHostMuteAll:false,voiceSpeaking:{},voicePlayerMutes:{},
  _detTarget:null,_detName:'',_connectionAttempts:0,
};

/* ══════════════════════════════════════════════
   TRANSITION
══════════════════════════════════════════════ */
let _tw=null;
function transition(fn,fast=false){
  const el=document.getElementById('curtain');
  el.classList.add('show');clearTimeout(_tw);
  _tw=setTimeout(()=>{fn();el.classList.remove('show');},fast?160:240);
}

/* ══════════════════════════════════════════════
   TYPEWRITER
══════════════════════════════════════════════ */
let _twTimer=null;
function typewrite(id,text,speed=22){
  const el=document.getElementById(id);if(!el)return;
  clearTimeout(_twTimer);el.textContent='';el.classList.add('tw');
  let i=0;
  function tick(){if(i<text.length){el.textContent+=text[i++];_twTimer=setTimeout(tick,speed);}else el.classList.remove('tw');}
  tick();
}

/* ══════════════════════════════════════════════
   VOICE MODULE
══════════════════════════════════════════════ */
const VOICE={
  stream:null,calls:{},audios:{},analyser:null,actx:null,speaking:false,_tick:null,
  async init(){
    try{
      this.stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});
      this.actx=new(window.AudioContext||window.webkitAudioContext)();
      const src=this.actx.createMediaStreamSource(this.stream);
      this.analyser=this.actx.createAnalyser();this.analyser.fftSize=512;
      src.connect(this.analyser);this.startDetect();
      S.voiceEnabled=true;updateVoiceBar();
      Object.keys(S.conns).forEach(pid=>this.callPeer(pid));
      if(!S.isHost&&S.conn)S.conn.send({type:'voice-ready',peerId:S.peer?.id});
      return true;
    }catch(e){S.voiceEnabled=false;updateVoiceBar();return false;}
  },
  startDetect(){
    if(this._tick)clearInterval(this._tick);
    const data=new Uint8Array(this.analyser.frequencyBinCount);
    this._tick=setInterval(()=>{
      if(!this.analyser)return;
      this.analyser.getByteFrequencyData(data);
      const avg=data.reduce((a,b)=>a+b,0)/data.length;
      const now=avg>14&&!S.voiceSelfMuted&&!S.voiceMutedByHost&&!S.voiceHostMuteAll;
      if(now!==this.speaking){
        this.speaking=now;S.voiceSpeaking[S.myId||'host']=now;
        const m={type:'speaking',id:S.myId||'host',val:now};
        if(S.isHost)broadcast(m);else if(S.conn)S.conn.send(m);
        renderSpeakDots();
      }
    },140);
  },
  callPeer(pid){if(!this.stream||this.calls[pid])return;const call=S.peer?.call(pid,this.stream);if(!call)return;this.calls[pid]=call;call.on('stream',s=>this.attachAudio(pid,s));call.on('close',()=>{delete this.calls[pid];this.detachAudio(pid);});},
  answerCall(call){this.calls[call.peer]=call;call.answer(this.stream||new MediaStream());call.on('stream',s=>this.attachAudio(call.peer,s));call.on('close',()=>{delete this.calls[call.peer];this.detachAudio(call.peer);});},
  attachAudio(pid,stream){if(this.audios[pid]){this.audios[pid].srcObject=stream;return;}const a=document.createElement('audio');a.srcObject=stream;a.autoplay=true;a.playsInline=true;a.volume=1;document.body.appendChild(a);this.audios[pid]=a;this.applyMute(pid);},
  detachAudio(pid){if(this.audios[pid]){this.audios[pid].srcObject=null;this.audios[pid].remove();delete this.audios[pid];}},
  applyMute(pid){const a=this.audios[pid];if(!a)return;a.muted=S.voiceHostMuteAll||(S.voicePlayerMutes[pid]||false);},
  applyAll(){Object.keys(this.audios).forEach(pid=>this.applyMute(pid));if(this.stream){const t=this.stream.getAudioTracks()[0];if(t)t.enabled=!S.voiceSelfMuted&&!S.voiceMutedByHost&&!S.voiceHostMuteAll;}},
  setGlobalMute(val){S.voiceHostMuteAll=val;this.applyAll();broadcast({type:'voice-global-mute',muted:val});},
  destroy(){
    if(this._tick)clearInterval(this._tick);
    Object.values(this.calls).forEach(c=>{try{c.close();}catch(e){}});this.calls={};
    Object.values(this.audios).forEach(a=>{a.srcObject=null;a.remove();});this.audios={};
    if(this.stream)this.stream.getTracks().forEach(t=>t.stop());this.stream=null;
    if(this.actx)this.actx.close();this.actx=null;
  }
};

function updateVoiceBar(){
  const bar=document.getElementById('vbar');
  const mic=document.getElementById('vb-mic');
  const lbl=document.getElementById('vb-lbl');
  const enb=document.getElementById('vb-en');
  if(!bar)return;
  const show=S.screen==='lobby'||S.screen==='game';
  bar.classList.toggle('show',show);if(!show)return;
  enb.style.display=S.voiceEnabled?'none':'block';
  mic.style.display=S.voiceEnabled?'flex':'none';
  if(!S.voiceEnabled){lbl.textContent='VOICE';lbl.className='vbl';return;}
  const muted=S.voiceSelfMuted||S.voiceMutedByHost||S.voiceHostMuteAll;
  mic.textContent=muted?'🔇':'🎤';mic.classList.toggle('muted',muted);
  if(muted){lbl.textContent='MUTED';lbl.className='vbl muted';}
  else if(S.voiceSpeaking[S.myId||'host']){lbl.textContent='SPEAKING';lbl.className='vbl on';}
  else{lbl.textContent='LIVE';lbl.className='vbl on';}
}
function renderSpeakDots(){
  document.querySelectorAll('[data-speak]').forEach(el=>{
    const id=el.dataset.speak;
    const speaking=S.voiceSpeaking[id]||false;
    const hushed=S.voiceHostMuteAll||(S.voicePlayerMutes[id]||false);
    el.className='speak-ring'+(hushed?' hushed':speaking?' active':'');
    el.textContent=hushed?'🔇':speaking?'🔊':'🎙';
  });
}

/* ══════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════ */
function render(){
  document.getElementById('app').innerHTML=screens();
  bind();updateVoiceBar();
  const narEl=document.getElementById('nar-txt');
  if(narEl&&S.narration&&!S.loading)typewrite('nar-txt',S.narration,20);
}

function screens(){
  if(S.screen==='welcome') return welcomeScreen();
  if(S.screen==='name')    return nameScreen();
  if(S.screen==='mode')    return modeScreen();
  if(S.screen==='join')    return joinScreen();
  if(S.screen==='lobby')   return lobbyScreen();
  if(S.screen==='game')    return gameScreen();
  return '';
}

function buildVoteBars(){
  const alive=S.players.filter(p=>p.alive);const total=alive.length||1;const counts={};
  alive.forEach(p=>{const v=S.voteData[p.id];if(v&&v!=='__abstain__')counts[v]=(counts[v]||0)+1;});
  const cast=Object.keys(S.voteData).length;if(!cast)return'';
  return `<div class="vtally">
    <div class="vtally-head">Votes Cast: ${cast} / ${total}</div>
    ${alive.map(p=>{const n=counts[p.id]||0,pct=Math.round(n/total*100);
      return`<div class="v-entry">
        <div class="v-entry-label"><span>${esc(p.name)}</span><span>${n}</span></div>
        <div class="v-track"><div class="v-fill" style="width:${pct}%"></div></div>
      </div>`;}).join('')}
  </div>`;
}

/* ══════════════════════════════════════════════
   BIND
══════════════════════════════════════════════ */
function bind(){
  const on=(id,fn)=>{const el=document.getElementById(id);if(el)el.addEventListener('click',fn);};
  on('goBtnStart',      ()=>transition(()=>{S.screen='name';S.error='';render();}));
  on('goBtnBackWelcome',()=>transition(()=>{S.screen='welcome';render();}));
  on('goBtnBackMode',   ()=>transition(()=>{S.screen='mode';S.error='';S.loading=false;render();}));
  on('goBtnJoin',       ()=>transition(()=>{S.screen='join';S.error='';render();}));
  on('goBtnNameNext',   ()=>{
    const v=document.getElementById('inp-name')?.value.trim();
    if(!v){S.error='Please enter your name.';render();return;}
    S.playerName=v;S.error='';
    const fromLink=new URLSearchParams(location.search).get('room');
    if(fromLink){S.roomCode=fromLink.toUpperCase();S.screen='join';}
    else S.screen='mode';
    transition(()=>render());
  });
  on('goBtnCreate',      createRoom);
  on('goBtnJoinConnect', doJoin);
  on('goBtnCopyLink',    ()=>{
    const link=`${location.origin}${location.pathname}?room=${S.roomCode}`;
    navigator.clipboard.writeText(link).then(()=>{
      const b=document.getElementById('goBtnCopyLink');
      if(b){b.textContent='✓ COPIED';setTimeout(()=>{const bb=document.getElementById('goBtnCopyLink');if(bb)bb.textContent='COPY';},2000);}
    }).catch(()=>prompt('Copy this link:',link));
  });
  on('goBtnHostStart',   hostStartGame);
  on('goBtnRoleReady',   ()=>{
    if(S.isHost){S._rolesReady++;S.phase='night';S.loading=true;render();checkAllRolesReady();}
    else{S.conn.send({type:'role-seen'});S.phase='night';S.loading=true;render();}
  });
  on('goBtnDetConfirm',  ()=>sendNightAction(S.nightActionType,S._detTarget));
  on('goBtnCupidConfirm',()=>{if(S.cupidPick.length===2)sendNightAction('cupid-link',S.cupidPick);});
  on('goBtnBeginVote',   ()=>{if(S.isHost)hostBeginVoting();});
  on('goBtnNextNight',   ()=>{if(S.isHost){S.nightNumber++;hostBeginNight();}});
  on('goBtnPlayAgain',   ()=>{VOICE.destroy();location.href=location.pathname;});
  on('goBtnHostMuteToggle',()=>{if(S.isHost){VOICE.setGlobalMute(!S.voiceHostMuteAll);render();}});

  const vbMic=document.getElementById('vb-mic');
  if(vbMic)vbMic.addEventListener('click',()=>{S.voiceSelfMuted=!S.voiceSelfMuted;VOICE.applyAll();updateVoiceBar();});
  const vbEn=document.getElementById('vb-en');
  if(vbEn)vbEn.addEventListener('click',async()=>{await VOICE.init();render();});

  const ni=document.getElementById('inp-name');
  if(ni){ni.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goBtnNameNext')?.click();});setTimeout(()=>ni.focus(),80);}
  const ci=document.getElementById('inp-code');
  if(ci){
    ci.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goBtnJoinConnect')?.click();});
    ci.addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});
    setTimeout(()=>ci.focus(),80);
  }

  document.querySelectorAll('[data-act-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.actId;
      if(S.nightActionType==='cupid-link'){
        if(S.cupidPick.includes(id))S.cupidPick=S.cupidPick.filter(x=>x!==id);
        else if(S.cupidPick.length<2)S.cupidPick.push(id);
        render();
      }else if(S.nightActionType==='detective-investigate'){
        const t=S.nightActionTargets.find(p=>p.id===id);
        S.nightActionResult=t?.isMafia||false;S._detName=t?.name||'';S._detTarget=id;render();
      }else{sendNightAction(S.nightActionType,id);}
    });
  });
  document.querySelectorAll('[data-vote-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.voteId==='__skip__'?null:btn.dataset.voteId;
      submitVote(id);
    });
  });
}

/* ══════════════════════════════════════════════
   NETWORKING — PeerJS with multiple fallback servers
══════════════════════════════════════════════ */
function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s='';for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;
}

// Multiple PeerJS configs tried in order — more fallbacks = better reliability
const PCONFIGS=[
  {host:'0.peerjs.com',    port:443, path:'/', secure:true,  debug:0, config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun2.l.google.com:19302'}]}},
  {host:'peerjs.com',      port:443, path:'/', secure:true,  debug:0, config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}},
  {host:'0.peerjs.com',    port:443, path:'/', secure:true,  debug:0},
  {host:'peerjs.com',      port:443, path:'/', secure:true,  debug:0},
  null, // PeerJS built-in default
];

function makePeer(id, cfgIdx, cb){
  cfgIdx=cfgIdx||0;
  if(cfgIdx>=PCONFIGS.length){cb(null,'Could not reach game server. Check your internet connection.');return;}
  S.connectionAttempt=cfgIdx+1;render();
  let p;
  try{
    const cfg=PCONFIGS[cfgIdx];
    p=(id&&cfg)?new Peer(id,cfg):(id?new Peer(id):(cfg?new Peer(cfg):new Peer()));
  }catch(e){makePeer(id,cfgIdx+1,cb);return;}

  const tid=setTimeout(()=>{try{p.destroy();}catch(e){}makePeer(id,cfgIdx+1,cb);},12000);

  p.on('open',()=>{clearTimeout(tid);cb(p,null);});
  p.on('error',err=>{
    clearTimeout(tid);
    if(err.type==='unavailable-id'){cb(null,'unavailable-id');return;}
    try{p.destroy();}catch(e){}
    makePeer(id,cfgIdx+1,cb);
  });
}

function createRoom(retryCount){
  retryCount=retryCount||0;
  const code=genCode();
  S.roomCode=code;S.isHost=true;S.myId='host';
  S.loading=true;S.error='';S.screen='mode';render();
  if(S.peer){try{S.peer.destroy();}catch(e){}}
  makePeer('maf-'+code.toLowerCase(),0,(p,err)=>{
    if(err==='unavailable-id'&&retryCount<5){createRoom(retryCount+1);return;}
    if(!p){S.loading=false;S.error=err||'Could not reach game server. Check your connection.';S.screen='mode';render();return;}
    S.peer=p;S.loading=false;
    S.lobbyPlayers=[{id:'host',name:S.playerName,isHost:true,connected:true,peerId:'maf-'+code.toLowerCase()}];
    S.screen='lobby';render();
    p.on('connection',conn=>{
      conn.on('open',()=>{
        S.conns[conn.peer]=conn;
        conn.on('data',msg=>hostOnMsg(conn,msg));
        conn.on('close',()=>{
          const pl=S.lobbyPlayers.find(x=>x.id===conn.peer);
          if(pl)pl.connected=false;
          delete S.conns[conn.peer];
          if(S.screen==='lobby')render();
        });
      });
    });
    p.on('call',call=>VOICE.answerCall(call));
  });
}

function doJoin(){
  const code=(document.getElementById('inp-code')?.value||'').trim().toUpperCase();
  if(!code||code.length<4){S.error='Please enter a valid room code.';render();return;}
  S.roomCode=code;S.isHost=false;S.loading=true;S.error='';render();
  if(S.peer){try{S.peer.destroy();}catch(e){}}
  makePeer(null,0,(p,err)=>{
    if(!p){S.loading=false;S.error=err||'Could not reach game server. Check your connection.';S.screen='join';render();return;}
    S.peer=p;S.myId=p.id;
    const hostId='maf-'+code.toLowerCase();
    const conn=p.connect(hostId,{reliable:true});
    const ctid=setTimeout(()=>{
      if(S.loading){S.loading=false;S.error='Could not connect — is the room code correct?';S.screen='join';render();}
    },12000);
    conn.on('open',()=>{clearTimeout(ctid);S.loading=false;S.conn=conn;conn.send({type:'join',name:S.playerName,peerId:p.id});S.screen='lobby';render();});
    conn.on('data',msg=>guestOnMsg(msg));
    conn.on('close',()=>{if(S.phase!=='over'){S.error='Lost connection to host.';S.screen='join';S.loading=false;render();}});
    conn.on('error',()=>{clearTimeout(ctid);S.error='Connection failed. Check the room code.';S.loading=false;S.screen='join';render();});
    p.on('call',call=>VOICE.answerCall(call));
  });
}

function broadcast(msg){Object.values(S.conns).forEach(c=>{try{c.send(msg);}catch(e){}});}
function broadcastLobby(){broadcast({type:'lobby',players:S.lobbyPlayers,settings:S.settings});}

/* ══════════════════════════════════════════════
   HOST MSG HANDLER
══════════════════════════════════════════════ */
function hostOnMsg(conn,msg){
  if(msg.type==='join'){
    const id=conn.peer;
    const ex=S.lobbyPlayers.find(p=>p.id===id);
    if(ex){ex.connected=true;ex.name=msg.name;ex.peerId=msg.peerId||id;}
    else S.lobbyPlayers.push({id,name:msg.name,isHost:false,connected:true,peerId:msg.peerId||id});
    const newPid=msg.peerId||id;
    Object.values(S.conns).forEach(c=>{if(c.peer!==id){try{c.send({type:'peer-joined',peerId:newPid});}catch(e){}}});
    const existing=S.lobbyPlayers.filter(p=>p.id!==id&&p.peerId).map(p=>p.peerId);
    conn.send({type:'existing-peers',peers:existing});
    broadcastLobby();render();
  }
  else if(msg.type==='role-seen'){S._rolesReady++;checkAllRolesReady();}
  else if(msg.type==='night-action'){hostProcessAction(conn.peer,msg.actionType,msg.target);}
  else if(msg.type==='vote'){hostProcessVote(conn.peer,msg.targetId);}
  else if(msg.type==='speaking'){S.voiceSpeaking[msg.id]=msg.val;broadcast(msg);renderSpeakDots();}
  else if(msg.type==='voice-ready'){if(VOICE.stream&&msg.peerId)VOICE.callPeer(msg.peerId);}
}
function checkAllRolesReady(){if(S._rolesReady>=S._totalPlayers){S._rolesReady=0;hostBeginNight();}}

/* ══════════════════════════════════════════════
   GUEST MSG HANDLER
══════════════════════════════════════════════ */
function guestOnMsg(msg){
  if(msg.type==='lobby'){S.lobbyPlayers=msg.players;S.settings=msg.settings;S.screen='lobby';render();}
  else if(msg.type==='game-start'){S.myRole=msg.role;S.players=msg.players;S.phase='roleReveal';S.screen='game';transition(()=>render());}
  else if(msg.type==='night-begin'){S.nightNumber=msg.nightNumber;S.phase='night';S.narration='';S.loading=true;render();}
  else if(msg.type==='night-start'){S.phase='night';S.narration=msg.narration||'';S.loading=false;S.nightNumber=msg.nightNumber||S.nightNumber;S.nightActionType=null;S.nightActionResult=null;S.cupidPick=[];render();}
  else if(msg.type==='your-turn'){S.phase='nightAction';S.nightActionType=msg.actionType;S.nightActionTargets=msg.targets;S.nightActionResult=null;S.cupidPick=[];render();}
  else if(msg.type==='day-start'){S.phase='day';S.nightDead=msg.dead;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.nightNumber=msg.nightNumber;transition(()=>render());}
  else if(msg.type==='vote-start'){S.phase='vote';S.voteData={};S.players=msg.players;render();}
  else if(msg.type==='vote-update'){S.voteData=msg.voteData||S.voteData;render();}
  else if(msg.type==='vote-result'){S.phase='voteResult';S.votedOut=msg.eliminated;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.winner=msg.winner||null;render();}
  else if(msg.type==='game-over'){S.phase='over';S.winner=msg.winner;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.screen='game';transition(()=>render());}
  else if(msg.type==='voice-global-mute'){S.voiceMutedByHost=msg.muted;VOICE.applyAll();updateVoiceBar();}
  else if(msg.type==='voice-muted-by-host'){S.voiceMutedByHost=msg.muted;VOICE.applyAll();updateVoiceBar();}
  else if(msg.type==='speaking'){S.voiceSpeaking[msg.id]=msg.val;renderSpeakDots();}
  else if(msg.type==='peer-joined'){if(VOICE.stream)VOICE.callPeer(msg.peerId);}
  else if(msg.type==='existing-peers'){if(VOICE.stream)msg.peers.forEach(pid=>{if(pid!==S.peer?.id)VOICE.callPeer(pid);});}
}

/* ══════════════════════════════════════════════
   GAME LOGIC (HOST)
══════════════════════════════════════════════ */
async function hostStartGame(){
  const pl=S.lobbyPlayers;
  if(pl.length<4){S.error='Need at least 4 players!';render();return;}
  const cfg=S.settings;
  const spec=cfg.mafia+cfg.doctor+cfg.detective+cfg.cupid+cfg.jester;
  if(spec>pl.length){S.error='Too many special roles for player count!';render();return;}
  const roles=[];
  for(let i=0;i<cfg.mafia;i++)roles.push('Mafia');
  if(cfg.doctor)roles.push('Doctor');
  if(cfg.detective)roles.push('Detective');
  if(cfg.cupid)roles.push('Cupid');
  if(cfg.jester)roles.push('Jester');
  while(roles.length<pl.length)roles.push('Civilian');
  const shuffled=shuffle(roles);
  S.players=pl.map((p,i)=>({id:p.id,name:p.name,role:shuffled[i],alive:true}));
  S.lovers=[];S.nightNumber=1;S.nightActions={};
  S._totalPlayers=pl.length;S._rolesReady=0;
  if(VOICE.stream)VOICE.setGlobalMute(true);
  S.players.forEach(player=>{
    const vis=S.players.map(p=>({
      id:p.id,name:p.name,alive:p.alive,
      role:(p.id===player.id||(player.role==='Mafia'&&p.role==='Mafia'))?p.role:undefined
    }));
    if(player.id==='host'){S.myRole=player.role;S.screen='game';S.phase='roleReveal';}
    else S.conns[player.id]?.send({type:'game-start',role:player.role,players:vis});
  });
  transition(()=>render());
}

async function hostBeginNight(){
  S.nightActions={};S._nightQ=[];S.phase='night';S.loading=true;
  if(VOICE.stream)VOICE.setGlobalMute(true);
  render();broadcast({type:'night-begin',nightNumber:S.nightNumber});
  const t=await callGM(`Mafia Game Master. Night ${S.nightNumber} begins in a gritty city. One short atmospheric sentence about darkness falling.`);
  S.narration=t;S.loading=false;
  broadcast({type:'night-start',narration:t,nightNumber:S.nightNumber});
  render();buildAndRunNightQueue();
}

function buildAndRunNightQueue(){
  const alive=S.players.filter(p=>p.alive);const q=[];
  if(S.nightNumber===1){const c=alive.find(p=>p.role==='Cupid');if(c)q.push(c);}
  const mafia=alive.filter(p=>p.role==='Mafia');if(mafia.length>0)q.push(mafia[0]);
  const doc=alive.find(p=>p.role==='Doctor');if(doc)q.push(doc);
  const det=alive.find(p=>p.role==='Detective');if(det)q.push(det);
  S._nightQ=[...q];runNextNightActor();
}

function runNextNightActor(){
  if(!S._nightQ||S._nightQ.length===0){hostResolveNight();return;}
  const actor=S._nightQ.shift();S._curActor=actor;
  const alive=S.players.filter(p=>p.alive);const others=alive.filter(p=>p.id!==actor.id);
  let actionType='';let targets=[];
  if(actor.role==='Cupid'){actionType='cupid-link';targets=alive.map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Mafia'){actionType='mafia-kill';targets=others.filter(p=>p.role!=='Mafia').map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Doctor'){actionType='doctor-protect';targets=alive.map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Detective'){actionType='detective-investigate';targets=others.map(p=>({id:p.id,name:p.name,isMafia:p.role==='Mafia'}));}
  if(actor.id==='host'){
    S.phase='nightAction';S.nightActionType=actionType;S.nightActionTargets=targets;S.nightActionResult=null;S.cupidPick=[];render();
  }else{
    S.conns[actor.id]?.send({type:'your-turn',actionType,targets});S.phase='night';render();
  }
}

function sendNightAction(actionType,target){
  if(S.isHost){hostProcessAction('host',actionType,target);S.phase='night';render();}
  else{S.conn.send({type:'night-action',actionType,target});S.phase='night';S.nightActionType=null;render();}
}

function hostProcessAction(actorId,actionType,target){
  if(actionType==='mafia-kill')S.nightActions.mafiaTarget=target;
  else if(actionType==='doctor-protect')S.nightActions.doctorTarget=target;
  else if(actionType==='detective-investigate')S.nightActions.detectiveTarget=target;
  else if(actionType==='cupid-link'){
    S.nightActions.cupidTargets=Array.isArray(target)?target:[target];
    S.lovers=S.nightActions.cupidTargets;
    S.players=S.players.map(p=>({...p,isLover:S.lovers.includes(p.id)}));
  }
  runNextNightActor();
}

async function hostResolveNight(){
  const na=S.nightActions;let dead=[];
  if(na.mafiaTarget&&na.mafiaTarget!==na.doctorTarget){
    const t=S.players.find(p=>p.id===na.mafiaTarget&&p.alive);if(t)dead.push(t);
  }
  const seen=new Set(dead.map(d=>d.id));let chg=true;
  while(chg){chg=false;[...dead].forEach(d=>{if(S.lovers.includes(d.id)){S.lovers.forEach(lid=>{if(lid!==d.id&&!seen.has(lid)){const p=S.players.find(x=>x.id===lid&&x.alive);if(p){dead.push(p);seen.add(lid);chg=true;}}});}});}
  const deadSet=new Set(dead.map(d=>d.id));
  S.players=S.players.map(p=>({...p,alive:deadSet.has(p.id)?false:p.alive}));
  S.nightDead=dead;S.nightActions={};S.loading=true;render();
  const w=checkWin(S.players);
  const prompt=dead.length===0
    ?`Mafia game narration. Night ${S.nightNumber}: the doctor saved someone. One eerie sentence about a peaceful dawn in a suspicious city.`
    :`Mafia game narration. Night ${S.nightNumber}: found dead at dawn: ${dead.map(d=>d.name).join(', ')}. Two atmospheric sentences for a crime city morning.`;
  const t=await callGM(prompt);S.narration=t;S.loading=false;
  if(w){await hostEndGame(w);return;}
  if(VOICE.stream)VOICE.setGlobalMute(false);
  const dayMsg={type:'day-start',dead:dead.map(d=>({id:d.id,name:d.name,role:d.role})),narration:t,players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive})),nightNumber:S.nightNumber};
  broadcast(dayMsg);S.phase='day';transition(()=>render());
}

function hostBeginVoting(){
  const alive=S.players.filter(p=>p.alive);
  S.voteData={};S._voteExpected=alive.length;
  broadcast({type:'vote-start',players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive}))});
  S.phase='vote';render();
}

function submitVote(targetId){
  const myId=S.myId||'host';const vv=targetId===null?'__abstain__':targetId;
  S.voteData[myId]=vv;render();
  if(S.isHost)hostProcessVote('host',targetId);
  else S.conn.send({type:'vote',targetId});
}

function hostProcessVote(voterId,targetId){
  const vv=targetId===null?'__abstain__':targetId;
  S.voteData[voterId]=vv;
  const alive=S.players.filter(p=>p.alive);
  const cast=alive.filter(p=>S.voteData.hasOwnProperty(p.id)).length;
  broadcast({type:'vote-update',voteData:S.voteData});
  if(cast>=alive.length)hostResolveVote();
  else render();
}

async function hostResolveVote(){
  const alive=S.players.filter(p=>p.alive);const counts={};
  alive.forEach(p=>{const v=S.voteData[p.id];if(v&&v!=='__abstain__')counts[v]=(counts[v]||0)+1;});
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  let elim=null;
  if(sorted.length>0&&(sorted.length===1||sorted[0][1]>sorted[1][1]))elim=S.players.find(p=>p.id===sorted[0][0]);
  if(elim){
    S.players=S.players.map(p=>({...p,alive:p.id===elim.id?false:p.alive}));
    if(S.lovers.includes(elim.id))S.lovers.forEach(lid=>{if(lid!==elim.id)S.players=S.players.map(p=>({...p,alive:p.id===lid?false:p.alive}));});
  }
  S.votedOut=elim||null;S.loading=true;render();
  const w=checkWin(S.players,elim);
  const t=await callGM(elim
    ?`Mafia city game. Day vote: citizens eliminated ${elim.name}, who was ${elim.role}. Two dramatic sentences.`
    :`Mafia city game. The vote was tied — no one eliminated. One tense sentence about unresolved suspicion.`);
  S.narration=t;S.loading=false;
  if(w){await hostEndGame(w);return;}
  broadcast({type:'vote-result',eliminated:elim?{id:elim.id,name:elim.name,role:elim.role}:null,narration:t,players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive})),winner:null});
  S.phase='voteResult';render();
}

async function hostEndGame(winner){
  S.winner=winner;S.loading=true;S.phase='over';
  if(VOICE.stream)VOICE.setGlobalMute(false);
  render();
  const t=await callGM(`Mafia city game ended. ${winner} won. Two climactic sentences.`);
  S.narration=t;S.loading=false;
  broadcast({type:'game-over',winner,narration:t,players:S.players});
  transition(()=>render());
}

/* ══════════════════════════════════════════════
   HELPERS
══════════════════════════════════════════════ */
function checkWin(ps,elim=null){
  if(elim?.role==='Jester')return'Jester';
  const aM=ps.filter(p=>p.alive&&p.role==='Mafia').length;
  const aT=ps.filter(p=>p.alive&&p.role!=='Mafia'&&p.role!=='Jester').length;
  if(aM===0)return'Town';if(aM>=aT)return'Mafia';return null;
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

async function callGM(prompt){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    if(d.content&&d.content[0]?.text)return d.content[0].text;
    return'The city waits in uneasy silence…';
  }catch{return'The city waits in uneasy silence…';}
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ══ INIT ══ */
const urlRoom=new URLSearchParams(location.search).get('room');
if(urlRoom){S.roomCode=urlRoom.toUpperCase();S.screen='name';}
render();
</script>
