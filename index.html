 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MAFIA</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════
   DESIGN SYSTEM — Noir Broadsheet
   ══════════════════════════════════════════════ */
:root {
  --ink:       #0e0c0a;
  --paper:     #f5f0e8;
  --paper2:    #ede7d9;
  --sepia:     #c8a96e;
  --rust:      #8b3a2a;
  --rust2:     #c0442b;
  --navy:      #1a2744;
  --navy2:     #243460;
  --forest:    #1a3d2b;
  --forest2:   #2a6040;
  --muted:     #6b5d4a;
  --border:    rgba(14,12,10,.15);
  --border2:   rgba(14,12,10,.08);
  --r:         2px;
  --shadow:    0 2px 20px rgba(14,12,10,.12), 0 1px 4px rgba(14,12,10,.08);
  --shadow-lg: 0 8px 40px rgba(14,12,10,.18), 0 2px 8px rgba(14,12,10,.1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--ink);
  color: var(--ink);
  font-family: 'Libre Baskerville', Georgia, serif;
  font-size: 15px;
  line-height: 1.6;
  overflow-x: hidden;
}

/* ── NOISE TEXTURE OVERLAY ── */
body::after {
  content: '';
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity: 0.35;
}

/* ── BG CANVAS ── */
#bg-canvas { position: fixed; inset: 0; z-index: 0; }

/* ── APP WRAPPER ── */
#app { position: relative; z-index: 1; min-height: 100vh; }

/* ── PAGE ── */
.page {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  position: relative;
}

/* ══════════════════════════════════════════════
   NEWSPAPER CARD
   ══════════════════════════════════════════════ */
.card {
  background: var(--paper);
  border: 1px solid rgba(14,12,10,.25);
  border-radius: var(--r);
  padding: 32px 28px;
  width: 100%; max-width: 500px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 4px;
  background: var(--ink);
}
.card::after {
  content: '';
  position: absolute; top: 4px; left: 0; right: 0; height: 2px;
  background: repeating-linear-gradient(90deg, var(--sepia) 0, var(--sepia) 8px, transparent 8px, transparent 12px);
  opacity: .5;
}

/* Ruled paper lines */
.card-lined::before {
  display: none;
}
.card-lined {
  background-image: repeating-linear-gradient(
    transparent,
    transparent 27px,
    rgba(14,12,10,.06) 27px,
    rgba(14,12,10,.06) 28px
  );
}

/* ══════════════════════════════════════════════
   MASTHEAD / TYPOGRAPHY
   ══════════════════════════════════════════════ */
.masthead {
  text-align: center;
  border-bottom: 3px double var(--ink);
  padding-bottom: 14px;
  margin-bottom: 20px;
}
.masthead-title {
  font-family: 'Playfair Display', serif;
  font-weight: 900;
  font-size: clamp(42px, 12vw, 72px);
  letter-spacing: -1px;
  line-height: 1;
  color: var(--ink);
  text-transform: uppercase;
}
.masthead-sub {
  font-family: 'Special Elite', cursive;
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--muted);
  text-transform: uppercase;
  margin-top: 4px;
}
.masthead-rule {
  display: flex; align-items: center; gap: 10px;
  margin: 10px 0 4px;
  font-family: 'Special Elite', cursive;
  font-size: 9px; letter-spacing: 3px; color: var(--muted);
  text-transform: uppercase;
}
.masthead-rule::before, .masthead-rule::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.section-head {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--ink);
  border-bottom: 2px solid var(--ink);
  padding-bottom: 4px;
  margin-bottom: 14px;
}
.section-head.sm {
  font-size: 13px;
  font-family: 'Special Elite', cursive;
  font-weight: 400;
  letter-spacing: 2px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--border);
}

h2 {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 22px;
  color: var(--ink);
  margin-bottom: 10px;
}
h3 {
  font-family: 'Special Elite', cursive;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 12px;
}

.lede {
  font-family: 'Libre Baskerville', serif;
  font-style: italic;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.7;
  text-align: center;
}

/* ══════════════════════════════════════════════
   INPUTS
   ══════════════════════════════════════════════ */
.field {
  margin-bottom: 14px;
}
.field label {
  display: block;
  font-family: 'Special Elite', cursive;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}
input[type=text] {
  width: 100%;
  background: white;
  border: 1px solid var(--border);
  border-bottom: 2px solid var(--ink);
  border-radius: 0;
  color: var(--ink);
  font-family: 'Special Elite', cursive;
  font-size: 16px;
  padding: 10px 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
  letter-spacing: 1px;
}
input[type=text]:focus {
  border-color: var(--ink);
  box-shadow: 0 2px 0 0 var(--ink);
}
input[type=text].code-input {
  text-align: center;
  font-size: 26px;
  letter-spacing: 12px;
  text-transform: uppercase;
  font-family: 'Playfair Display', serif;
  padding: 14px 20px;
}
input::placeholder { color: rgba(14,12,10,.25); letter-spacing: 1px; }

/* ══════════════════════════════════════════════
   BUTTONS
   ══════════════════════════════════════════════ */
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  width: 100%;
  background: var(--ink);
  border: 2px solid var(--ink);
  border-radius: var(--r);
  color: var(--paper);
  font-family: 'Special Elite', cursive;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  padding: 14px 20px;
  cursor: pointer;
  transition: all .2s;
  margin-bottom: 10px;
  position: relative;
  overflow: hidden;
}
.btn::after {
  content: '';
  position: absolute; inset: 0;
  background: white;
  opacity: 0;
  transition: opacity .15s;
}
.btn:hover:not(:disabled)::after { opacity: .08; }
.btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(14,12,10,.25); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: .35; cursor: not-allowed; }

.btn.outline {
  background: transparent;
  color: var(--ink);
}
.btn.outline:hover:not(:disabled)::after { opacity: 0; }
.btn.outline:hover:not(:disabled) { background: var(--ink); color: var(--paper); }

.btn.danger {
  background: var(--rust);
  border-color: var(--rust);
}
.btn.success {
  background: var(--forest);
  border-color: var(--forest);
}
.btn.accent {
  background: var(--navy);
  border-color: var(--navy);
}
.btn.sm {
  padding: 9px 14px;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 0;
  width: auto;
}

/* ══════════════════════════════════════════════
   DIVIDER
   ══════════════════════════════════════════════ */
.divider {
  display: flex; align-items: center; gap: 10px;
  margin: 18px 0;
  color: var(--muted);
  font-family: 'Special Elite', cursive;
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}
.divider.heavy::before, .divider.heavy::after {
  height: 2px;
  background: var(--ink);
}

/* ══════════════════════════════════════════════
   CODE DISPLAY
   ══════════════════════════════════════════════ */
.code-block {
  background: var(--ink);
  border-radius: var(--r);
  padding: 18px 20px;
  text-align: center;
  margin-bottom: 14px;
  position: relative;
  overflow: hidden;
}
.code-block::before {
  content: 'ROOM CODE';
  display: block;
  font-family: 'Special Elite', cursive;
  font-size: 9px;
  letter-spacing: 4px;
  color: rgba(245,240,232,.4);
  margin-bottom: 8px;
}
.code-val {
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  font-weight: 900;
  letter-spacing: 14px;
  color: var(--paper);
  text-shadow: 0 0 20px rgba(200,169,110,.3);
}

/* ══════════════════════════════════════════════
   PLAYER ROWS
   ══════════════════════════════════════════════ */
.player-list { margin-bottom: 4px; }
.player-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px;
  border: 1px solid var(--border2);
  border-bottom: 1px solid var(--border);
  background: white;
  font-size: 15px;
  transition: all .3s;
  animation: slideRow .35s ease both;
}
.player-row:first-child { border-radius: 2px 2px 0 0; }
.player-row:last-child { border-radius: 0 0 2px 2px; }
.player-row:only-child { border-radius: 2px; }
.player-row + .player-row { border-top: none; }
.player-row.dead { opacity: .3; text-decoration: line-through; }

@keyframes slideRow {
  from { opacity: 0; transform: translateX(-10px); }
  to   { opacity: 1; transform: translateX(0); }
}

.status-dot {
  width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
}
.status-dot.on  { background: var(--forest2); box-shadow: 0 0 6px rgba(42,96,64,.5); }
.status-dot.off { background: var(--rust2); }

.player-name { flex: 1; font-family: 'Libre Baskerville', serif; }
.player-badge {
  font-family: 'Special Elite', cursive;
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  background: var(--paper2);
  padding: 2px 7px;
  border: 1px solid var(--border);
  border-radius: 1px;
}

/* Speaking ring */
.speak-dot {
  width: 22px; height: 22px; border-radius: 50%;
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  transition: all .25s;
  flex-shrink: 0;
  background: var(--paper2);
}
.speak-dot.active {
  border-color: var(--forest2);
  background: rgba(42,96,64,.1);
  box-shadow: 0 0 8px rgba(42,96,64,.35);
  animation: speakPulse .8s ease infinite;
}
.speak-dot.hushed {
  border-color: var(--rust2);
  background: rgba(139,58,42,.08);
}
@keyframes speakPulse {
  0%,100% { box-shadow: 0 0 6px rgba(42,96,64,.3); }
  50%      { box-shadow: 0 0 14px rgba(42,96,64,.7); }
}

/* ══════════════════════════════════════════════
   SETTINGS (Role Counter)
   ══════════════════════════════════════════════ */
.settings-grid {
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--r);
  overflow: hidden;
  margin-bottom: 16px;
}
.role-row {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border2);
  transition: background .15s;
}
.role-row:last-child { border-bottom: none; }
.role-row:hover { background: var(--paper2); }
.role-icon { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
.role-name { flex: 1; font-family: 'Libre Baskerville', serif; font-size: 14px; }
.role-desc { font-size: 11px; color: var(--muted); font-style: italic; }
.counter {
  display: flex; align-items: center; gap: 8px; flex-shrink: 0;
}
.counter-btn {
  width: 26px; height: 26px;
  background: var(--ink);
  border: none;
  border-radius: 1px;
  color: var(--paper);
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
  line-height: 1;
  font-family: 'Playfair Display', serif;
}
.counter-btn:hover { background: var(--muted); }
.counter-val {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  font-weight: 700;
  min-width: 20px;
  text-align: center;
  color: var(--ink);
}

/* ══════════════════════════════════════════════
   ALERTS
   ══════════════════════════════════════════════ */
.alert {
  padding: 10px 14px;
  border-left: 3px solid;
  margin-bottom: 14px;
  font-size: 13px;
  line-height: 1.5;
  font-family: 'Special Elite', cursive;
  letter-spacing: .5px;
}
.alert.err    { border-color: var(--rust2); background: rgba(139,58,42,.07); color: var(--rust); }
.alert.info   { border-color: var(--navy2); background: rgba(26,39,68,.07); color: var(--navy); }
.alert.ok     { border-color: var(--forest2); background: rgba(26,61,43,.07); color: var(--forest); }
.alert.warn   { border-color: var(--sepia); background: rgba(200,169,110,.1); color: #7a5c20; }

/* ══════════════════════════════════════════════
   TARGET BUTTONS (night actions / voting)
   ══════════════════════════════════════════════ */
.choice-list { margin-bottom: 4px; }
.choice-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%;
  background: white;
  border: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  cursor: pointer;
  text-align: left;
  font-family: 'Libre Baskerville', serif;
  font-size: 15px;
  color: var(--ink);
  transition: all .15s;
  position: relative;
}
.choice-btn + .choice-btn { border-top: none; }
.choice-btn:first-child { border-radius: 2px 2px 0 0; }
.choice-btn:last-child { border-radius: 0 0 2px 2px; }
.choice-btn:only-child { border-radius: 2px; }
.choice-btn:hover { background: var(--paper2); transform: translateX(3px); }
.choice-btn.selected {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.choice-btn .choice-marker {
  width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid currentColor;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px;
  opacity: .5;
}
.choice-btn.selected .choice-marker { opacity: 1; }

/* ══════════════════════════════════════════════
   ROLE REVEAL CARD
   ══════════════════════════════════════════════ */
.role-reveal {
  text-align: center;
  padding: 10px 0;
}
.role-reveal .role-emoji {
  font-size: 72px;
  display: block;
  margin-bottom: 14px;
  animation: iconDrop .5s cubic-bezier(.34,1.56,.64,1) both;
  filter: drop-shadow(0 4px 12px rgba(14,12,10,.2));
}
@keyframes iconDrop {
  from { transform: translateY(-24px) scale(.6); opacity: 0; }
  to   { transform: none; opacity: 1; }
}
.role-reveal .role-name-tag {
  display: inline-block;
  background: var(--ink);
  color: var(--paper);
  font-family: 'Special Elite', cursive;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  padding: 6px 18px;
  border-radius: 1px;
  margin-bottom: 14px;
}
.role-reveal .role-name-tag.mafia  { background: var(--rust); }
.role-reveal .role-name-tag.doctor  { background: var(--forest); }
.role-reveal .role-name-tag.detective { background: var(--navy); }
.role-reveal .role-name-tag.cupid  { background: #7a1a3a; }
.role-reveal .role-name-tag.jester { background: #5a3a00; }

/* ══════════════════════════════════════════════
   HEADLINE STRIP
   ══════════════════════════════════════════════ */
.headline {
  background: var(--ink);
  color: var(--paper);
  padding: 12px 16px;
  border-radius: var(--r);
  margin-bottom: 14px;
  position: relative;
}
.headline .kicker {
  font-family: 'Special Elite', cursive;
  font-size: 9px;
  letter-spacing: 4px;
  color: var(--sepia);
  text-transform: uppercase;
  display: block;
  margin-bottom: 5px;
}
.headline h2 {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  color: var(--paper);
  margin-bottom: 0;
  line-height: 1.3;
}

/* ══════════════════════════════════════════════
   DEAD LIST
   ══════════════════════════════════════════════ */
.obituary {
  background: var(--paper2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--rust2);
  padding: 12px 14px;
  margin-bottom: 14px;
  border-radius: 0 var(--r) var(--r) 0;
}
.obituary .obit-head {
  font-family: 'Special Elite', cursive;
  font-size: 9px;
  letter-spacing: 3px;
  color: var(--rust2);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.obit-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 14px;
}
.obit-row:last-child { border-bottom: none; }

/* ══════════════════════════════════════════════
   VOTE BAR
   ══════════════════════════════════════════════ */
.vote-tally { margin-bottom: 14px; }
.vote-tally-head {
  font-family: 'Special Elite', cursive;
  font-size: 9px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--muted); margin-bottom: 10px;
}
.vote-entry { margin-bottom: 7px; }
.vote-entry-label {
  display: flex; justify-content: space-between;
  font-size: 13px; margin-bottom: 3px;
  font-family: 'Special Elite', cursive; letter-spacing: .5px;
}
.vote-track {
  height: 7px; background: var(--paper2);
  border: 1px solid var(--border); border-radius: 1px;
  overflow: hidden;
}
.vote-fill {
  height: 100%; background: var(--ink);
  border-radius: 1px;
  transition: width .6s cubic-bezier(.34,1.56,.64,1);
  width: 0;
}

/* ══════════════════════════════════════════════
   LINK ROW
   ══════════════════════════════════════════════ */
.link-strip {
  display: flex; gap: 6px; align-items: center;
  background: var(--paper2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 9px 12px;
  margin-bottom: 14px;
}
.link-strip span {
  flex: 1; font-size: 11px; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  font-family: 'Special Elite', cursive; letter-spacing: .5px;
}
.link-strip button {
  flex-shrink: 0; background: var(--ink);
  border: none; border-radius: 1px;
  color: var(--paper); font-family: 'Special Elite', cursive;
  font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
  padding: 5px 11px; cursor: pointer; transition: background .2s;
}
.link-strip button:hover { background: var(--muted); }

/* ══════════════════════════════════════════════
   SPINNER / LOADING
   ══════════════════════════════════════════════ */
.spin {
  display: inline-block; width: 18px; height: 18px;
  border: 2px solid rgba(14,12,10,.1);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: rot .6s linear infinite;
  vertical-align: middle;
}
@keyframes rot { to { transform: rotate(360deg); } }

.loading-state {
  text-align: center; padding: 28px 0;
}
.loading-state p {
  font-family: 'Special Elite', cursive;
  font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
  color: var(--muted); margin-top: 14px;
}

/* ══════════════════════════════════════════════
   TRANSITIONS & ANIMATIONS
   ══════════════════════════════════════════════ */
#curtain {
  position: fixed; inset: 0; background: var(--ink);
  z-index: 9998; pointer-events: none;
  opacity: 0; transition: opacity .3s;
}
#curtain.show { opacity: 1; }

.fade { animation: fadeUp .45s ease both; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.flip { animation: flipCard .55s cubic-bezier(.34,1.2,.64,1) both; }
@keyframes flipCard {
  from { transform: perspective(800px) rotateX(-18deg) scale(.94); opacity: 0; }
  to   { transform: none; opacity: 1; }
}

.stamp { animation: stampIn .4s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes stampIn {
  from { transform: scale(1.25); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}

/* stagger children */
.stagger > * { animation: fadeUp .4s ease both; }
.stagger > *:nth-child(1) { animation-delay: .04s }
.stagger > *:nth-child(2) { animation-delay: .08s }
.stagger > *:nth-child(3) { animation-delay: .12s }
.stagger > *:nth-child(4) { animation-delay: .16s }

<body>
<canvas id="bg-canvas"></canvas>
<div id="curtain"></div>

<!-- Floating voice bar -->
<div id="voice-bar">
  <button class="vb-icon-btn" id="vb-mic" title="Toggle mic">🎤</button>
  <span class="vb-label" id="vb-label">VOICE CHAT</span>
  <button class="vb-text-btn" id="vb-enable">ENABLE MIC</button>
</div>

<div id="app"></div>

<script>
/* ══════════════════════════════════════════════
   DATA
   ══════════════════════════════════════════════ */
const ROLES = {
  Mafia:     { e:'🔪', label:'mafia' },
  Doctor:    { e:'💊', label:'doctor' },
  Detective: { e:'🔍', label:'detective' },
  Cupid:     { e:'💘', label:'cupid' },
  Jester:    { e:'🃏', label:'jester' },
  Civilian:  { e:'🏘️', label:'civilian' },
};
const RDESC = {
  Mafia:     'Each night, eliminate a civilian. Win when Mafia equal or outnumber the town.',
  Doctor:    'Each night, protect one person from death. You may protect yourself.',
  Detective: 'Each night, investigate someone to learn if they are Mafia.',
  Cupid:     'Tonight only: link two souls as lovers. If one dies, the other follows.',
  Jester:    'Win by being voted out during the day. Act suspicious — but not too obvious.',
  Civilian:  'Find and vote out the Mafia before they take over the town.',
};

/* ══════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════ */
let S = {
  screen:'welcome', playerName:'', isHost:false, roomCode:'',
  peer:null, conn:null, conns:{},
  lobbyPlayers:[], settings:{ mafia:1, doctor:1, detective:1, cupid:0, jester:0 },
  myRole:null, myId:null,
  phase:null, players:[], nightNumber:1, narration:'', loading:false,
  nightDead:[], votedOut:null, winner:null,
  nightActionType:null, nightActionTargets:[], nightActionResult:null,
  cupidPick:[], _detTarget:null, _detName:'',
  _nightQ:[], nightActions:{}, lovers:[], voteData:{},
  _rolesReady:0, _totalPlayers:0, error:'',
  // voice
  voiceEnabled:false, voiceSelfMuted:false, voiceMutedByHost:false,
  voiceHostMuteAll:false, voicePlayerMutes:{}, voiceSpeaking:{},
};

/* ══════════════════════════════════════════════
   BACKGROUND — moving ink dots
   ══════════════════════════════════════════════ */
(function bgCanvas() {
  const c = document.getElementById('bg-canvas');
  const ctx = c.getContext('2d');
  let W, H, dots = [];
  const resize = () => { W = c.width = innerWidth; H = c.height = innerHeight; };
  resize(); addEventListener('resize', resize);
  const isNight = () => document.body.classList.contains('night');
  for (let i = 0; i < 40; i++) dots.push({
    x: Math.random()*2000, y: Math.random()*1200,
    r: Math.random()*1.2+.3,
    vx: (Math.random()-.5)*.18, vy: (Math.random()-.5)*.12,
    a: Math.random()*.3+.05
  });
  function loop() {
    ctx.clearRect(0,0,W,H);
    const col = isNight() ? '200,169,110' : '14,12,10';
    dots.forEach(d => {
      d.x = (d.x+d.vx+W)%W; d.y = (d.y+d.vy+H)%H;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle = `rgba(${col},${d.a})`; ctx.fill();
    });
    requestAnimationFrame(loop);
  }
  loop();
})();

/* ══════════════════════════════════════════════
   TRANSITION
   ══════════════════════════════════════════════ */
let _tw = null;
function transition(fn, fast=false) {
  const el = document.getElementById('curtain');
  el.classList.add('show');
  clearTimeout(_tw);
  _tw = setTimeout(() => { fn(); el.classList.remove('show'); }, fast ? 180 : 280);
}

/* ══════════════════════════════════════════════
   NIGHT MODE
   ══════════════════════════════════════════════ */
function setNight(on) { document.body.classList.toggle('night', on); }

/* ══════════════════════════════════════════════
   TYPEWRITER
   ══════════════════════════════════════════════ */
let _twTimer = null;
function typewrite(id, text, speed=22) {
  const el = document.getElementById(id);
  if (!el) return;
  clearTimeout(_twTimer);
  el.textContent = ''; el.classList.add('tw');
  let i = 0;
  function tick() {
    if (i < text.length) { el.textContent += text[i++]; _twTimer = setTimeout(tick, speed); }
    else el.classList.remove('tw');
  }
  tick();
}

/* ══════════════════════════════════════════════
   VOICE MODULE
   ══════════════════════════════════════════════ */
const VOICE = {
  stream:null, calls:{}, audios:{}, analyser:null, actx:null, speaking:false, _tick:null,
  async init() {
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio:true, video:false });
      this.actx = new (window.AudioContext||window.webkitAudioContext)();
      const src = this.actx.createMediaStreamSource(this.stream);
      this.analyser = this.actx.createAnalyser(); this.analyser.fftSize = 512;
      src.connect(this.analyser);
      this.startDetect();
      S.voiceEnabled = true; updateVoiceBar();
      Object.keys(S.conns).forEach(pid => this.callPeer(pid));
      if (!S.isHost && S.conn) S.conn.send({ type:'voice-ready', peerId:S.peer?.id });
      return true;
    } catch(e) { S.voiceEnabled = false; updateVoiceBar(); return false; }
  },
  startDetect() {
    if (this._tick) clearInterval(this._tick);
    const data = new Uint8Array(this.analyser.frequencyBinCount);
    this._tick = setInterval(() => {
      if (!this.analyser) return;
      this.analyser.getByteFrequencyData(data);
      const avg = data.reduce((a,b)=>a+b,0)/data.length;
      const now = avg>14 && !S.voiceSelfMuted && !S.voiceMutedByHost && !S.voiceHostMuteAll;
      if (now !== this.speaking) {
        this.speaking = now;
        S.voiceSpeaking[S.myId||'host'] = now;
        const m = { type:'speaking', id:S.myId||'host', val:now };
        if (S.isHost) broadcast(m); else if (S.conn) S.conn.send(m);
        renderSpeakDots();
      }
    }, 140);
  },
  callPeer(pid) {
    if (!this.stream || this.calls[pid]) return;
    const call = S.peer?.call(pid, this.stream);
    if (!call) return;
    this.calls[pid] = call;
    call.on('stream', s => this.attachAudio(pid, s));
    call.on('close', () => { delete this.calls[pid]; this.detachAudio(pid); });
  },
  answerCall(call) {
    this.calls[call.peer] = call;
    call.answer(this.stream || new MediaStream());
    call.on('stream', s => this.attachAudio(call.peer, s));
    call.on('close', () => { delete this.calls[call.peer]; this.detachAudio(call.peer); });
  },
  attachAudio(pid, stream) {
    if (this.audios[pid]) { this.audios[pid].srcObject = stream; return; }
    const a = document.createElement('audio');
    a.srcObject = stream; a.autoplay = true; a.playsInline = true; a.volume = 1;
    document.body.appendChild(a); this.audios[pid] = a; this.applyMute(pid);
  },
  detachAudio(pid) {
    if (this.audios[pid]) { this.audios[pid].srcObject = null; this.audios[pid].remove(); delete this.audios[pid]; }
  },
  applyMute(pid) {
    const a = this.audios[pid]; if (!a) return;
    a.muted = S.voiceHostMuteAll || (S.voicePlayerMutes[pid]||false);
  },
  applyAll() {
    Object.keys(this.audios).forEach(pid => this.applyMute(pid));
    if (this.stream) {
      const t = this.stream.getAudioTracks()[0];
      if (t) t.enabled = !S.voiceSelfMuted && !S.voiceMutedByHost && !S.voiceHostMuteAll;
    }
  },
  setGlobalMute(val) {
    S.voiceHostMuteAll = val; this.applyAll();
    broadcast({ type:'voice-global-mute', muted:val });
  },
  destroy() {
    if (this._tick) clearInterval(this._tick);
    Object.values(this.calls).forEach(c => { try{c.close();}catch(e){} });
    this.calls = {};
    Object.values(this.audios).forEach(a => { a.srcObject=null; a.remove(); });
    this.audios = {};
    if (this.stream) this.stream.getTracks().forEach(t=>t.stop());
    this.stream = null;
    if (this.actx) this.actx.close(); this.actx = null;
  }
};

function updateVoiceBar() {
  const bar = document.getElementById('voice-bar');
  const mic = document.getElementById('vb-mic');
  const lbl = document.getElementById('vb-label');
  const enb = document.getElementById('vb-enable');
  if (!bar) return;
  const show = S.screen==='lobby' || S.screen==='game';
  bar.classList.toggle('visible', show);
  if (!show) return;
  enb.style.display = S.voiceEnabled ? 'none' : 'block';
  mic.style.display = S.voiceEnabled ? 'flex' : 'none';
  if (!S.voiceEnabled) { lbl.textContent='VOICE'; lbl.className='vb-label'; return; }
  const muted = S.voiceSelfMuted||S.voiceMutedByHost||S.voiceHostMuteAll;
  mic.textContent = muted ? '🔇' : '🎤';
  mic.classList.toggle('muted', muted);
  if (muted) { lbl.textContent='MUTED'; lbl.className='vb-label muted'; }
  else if (S.voiceSpeaking[S.myId||'host']) { lbl.textContent='SPEAKING'; lbl.className='vb-label on'; }
  else { lbl.textContent='LIVE'; lbl.className='vb-label on'; }
}

function renderSpeakDots() {
  document.querySelectorAll('[data-speak]').forEach(el => {
    const id = el.dataset.speak;
    const speaking = S.voiceSpeaking[id]||false;
    const hushed = S.voiceHostMuteAll||(S.voicePlayerMutes[id]||false);
    el.className = 'speak-dot' + (hushed?' hushed':speaking?' active':'');
    el.textContent = hushed?'🔇':speaking?'🔊':'🎙';
  });
}

/* ══════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════ */
function render() {
  document.getElementById('app').innerHTML = screens();
  bind();
  updateVoiceBar();
  const isNight = S.screen==='game' && ['night','nightAction','roleReveal'].includes(S.phase);
  setNight(isNight);
  if (S.narration && !S.loading) {
    setTimeout(() => typewrite('narration-text', '❝ ' + S.narration + ' ❞', 20), 100);
  }
}

function screens() {
  if (S.screen==='welcome') return welcome();
  if (S.screen==='name')    return nameScreen();
  if (S.screen==='mode')    return modeScreen();
  if (S.screen==='join')    return joinScreen();
  if (S.screen==='lobby')   return lobby();
  if (S.screen==='game')    return gameScreen();
  return '';
}

/* ══════════════════════════════════════════════
   SCREENS
   ══════════════════════════════════════════════ */
function welcome() {
  const today = new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  return `<div class="page fade">
    <div class="welcome-paper">
      <div class="paper-header">
        <div class="paper-date">
          <span>${today}</span>
          <span>Vol. I · Est. This Evening</span>
          <span>Price: Your Secrets</span>
        </div>
        <div class="paper-title">MAFIA</div>

function buildVoteBars() {
  const alive = S.players.filter(p=>p.alive);
  const total = alive.length||1;
  const counts = {};
  alive.forEach(p=>{const v=S.voteData[p.id];if(v&&v!=='__abstain__')counts[v]=(counts[v]||0)+1;});
  const cast = Object.keys(S.voteData).length;
  if (!cast) return '';
  return `<div class="vote-tally">
    <div class="vote-tally-head">Votes Cast: ${cast} / ${total}</div>
    ${alive.map(p=>{
      const n=counts[p.id]||0, pct=Math.round(n/total*100);
      return `<div class="vote-entry">
        <div class="vote-entry-label"><span>${esc(p.name)}</span><span>${n}</span></div>
        <div class="vote-track"><div class="vote-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ══════════════════════════════════════════════
   BIND
   ══════════════════════════════════════════════ */
function bind() {
  const on = (id,fn)=>{ const el=document.getElementById(id); if(el) el.addEventListener('click',fn); };
  on('goBtnStart',      ()=>transition(()=>{S.screen='name';S.error='';render();}));
  on('goBtnBackWelcome',()=>transition(()=>{S.screen='welcome';render();}));
  on('goBtnBackMode',   ()=>transition(()=>{S.screen='mode';S.error='';S.loading=false;render();}));
  on('goBtnJoin',       ()=>transition(()=>{S.screen='join';S.error='';render();}));
  on('goBtnNameNext',   ()=>{
    const v = document.getElementById('inp-name')?.value.trim();
    if (!v){S.error='Please enter your name.';render();return;}
    S.playerName=v; S.error='';
    const fromLink = new URLSearchParams(location.search).get('room');
    if (fromLink){S.roomCode=fromLink.toUpperCase();S.screen='join';}
    else S.screen='mode';
    transition(()=>render());
  });
  on('goBtnCreate',      createRoom);
  on('goBtnJoinConnect', doJoin);
  on('goBtnCopyLink',    ()=>{
    const link=`${location.origin}${location.pathname}?room=${S.roomCode}`;
    navigator.clipboard.writeText(link).then(()=>{
      const b=document.getElementById('goBtnCopyLink');
      if(b){b.textContent='✓ COPIED';setTimeout(()=>{const bb=document.getElementById('goBtnCopyLink');if(bb)bb.textContent='COPY LINK';},2000);}
    }).catch(()=>prompt('Copy this link:',link));
  });
  on('goBtnHostStart',      hostStartGame);
  on('goBtnRoleReady',      ()=>{
    if(S.isHost){S._rolesReady++;S.phase='night';S.loading=true;render();checkAllRolesReady();}
    else{S.conn.send({type:'role-seen'});S.phase='night';S.loading=true;render();}
  });
  on('goBtnDetConfirm',     ()=>sendNightAction(S.nightActionType,S._detTarget));
  on('goBtnCupidConfirm',   ()=>{if(S.cupidPick.length===2)sendNightAction('cupid-link',S.cupidPick);});
  on('goBtnBeginVote',      ()=>{if(S.isHost)hostBeginVoting();});
  on('goBtnNextNight',      ()=>{if(S.isHost){S.nightNumber++;hostBeginNight();}});
  on('goBtnPlayAgain',      ()=>{VOICE.destroy();location.href=location.pathname;});
  on('goBtnHostMuteToggle', ()=>{if(S.isHost){VOICE.setGlobalMute(!S.voiceHostMuteAll);render();}});

  // Voice bar
  const vbMic = document.getElementById('vb-mic');
  if (vbMic) vbMic.addEventListener('click',()=>{
    S.voiceSelfMuted=!S.voiceSelfMuted; VOICE.applyAll(); updateVoiceBar();
  });
  const vbEn = document.getElementById('vb-enable');
  if (vbEn) vbEn.addEventListener('click', async()=>{ await VOICE.init(); render(); });

  // Name input enter
  const ni = document.getElementById('inp-name');
  if (ni){ ni.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goBtnNameNext')?.click();}); setTimeout(()=>ni.focus(),80); }
  const ci = document.getElementById('inp-code');
  if (ci){
    ci.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('goBtnJoinConnect')?.click();});
    ci.addEventListener('input',e=>{e.target.value=e.target.value.toUpperCase();});
    setTimeout(()=>ci.focus(),80);
  }

  // Action buttons
  document.querySelectorAll('[data-act-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.actId;
      if(S.nightActionType==='cupid-link'){
        if(S.cupidPick.includes(id)) S.cupidPick=S.cupidPick.filter(x=>x!==id);
        else if(S.cupidPick.length<2) S.cupidPick.push(id);
        render();
      } else if(S.nightActionType==='detective-investigate'){
        const t=S.nightActionTargets.find(p=>p.id===id);
        S.nightActionResult=t?.isMafia||false; S._detName=t?.name||''; S._detTarget=id; render();
      } else {
        sendNightAction(S.nightActionType,id);
      }
    });
  });
  document.querySelectorAll('[data-vote-id]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const id=btn.dataset.voteId==='__skip__'?null:btn.dataset.voteId;
      submitVote(id);
    });
  });
}

window.adjSetting=function(role,d){
  S.settings[role]=Math.max(role==='mafia'?1:0,S.settings[role]+d);
  const el=document.getElementById('sval-'+role); if(el) el.textContent=S.settings[role];
  if(S.isHost) broadcastLobby();
};
window.hostToggleMute=function(pid){
  S.voicePlayerMutes[pid]=!S.voicePlayerMutes[pid];
  const conn=S.conns[pid]; if(conn) conn.send({type:'voice-muted-by-host',muted:S.voicePlayerMutes[pid]});
  if(VOICE.audios[pid]) VOICE.audios[pid].muted=S.voicePlayerMutes[pid];
  render();
};

/* ══════════════════════════════════════════════
   NETWORKING — PeerJS with fallbacks
   ══════════════════════════════════════════════ */
function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=c[Math.floor(Math.random()*c.length)]; return s;
}

// PeerJS configs tried in order
const PCONFIGS = [
  { host:'0.peerjs.com', port:443, path:'/', secure:true, debug:0 },
  { host:'peerjs.com',   port:443, path:'/', secure:true, debug:0 },
  null  // PeerJS default (falls back to peerjs.com automatically)
];

function makePeer(id, cfgIdx, cb) {
  cfgIdx = cfgIdx||0;
  if (cfgIdx >= PCONFIGS.length) { cb(null,'No broker available. Check your internet connection.'); return; }
  let p;
  try {
    const cfg = PCONFIGS[cfgIdx];
    p = (id && cfg) ? new Peer(id, cfg) : (id ? new Peer(id) : (cfg ? new Peer(cfg) : new Peer()));
  } catch(e) { makePeer(id, cfgIdx+1, cb); return; }

  const tid = setTimeout(()=>{
    try{p.destroy();}catch(e){}
    makePeer(id, cfgIdx+1, cb);
  }, 8000);

  p.on('open', ()=>{ clearTimeout(tid); cb(p, null); });
  p.on('error', err=>{
    clearTimeout(tid);
    if (err.type==='unavailable-id'){ cb(null,'unavailable-id'); return; }
    try{p.destroy();}catch(e){}
    makePeer(id, cfgIdx+1, cb);
  });
}

function createRoom(retryCount) {
  retryCount = retryCount||0;
  const code = genCode();
  S.roomCode = code; S.isHost = true; S.myId = 'host';
  S.loading = true; S.error = ''; S.screen = 'mode'; render();

  if (S.peer){try{S.peer.destroy();}catch(e){}}

  makePeer('maf-'+code.toLowerCase(), 0, (p, err)=>{
    if (err==='unavailable-id' && retryCount<5){ createRoom(retryCount+1); return; }
    if (!p){
      S.loading=false;
      S.error='Could not connect to game server. Please check your internet connection and try again.';
      S.screen='mode'; render(); return;
    }
    S.peer = p;
    S.loading = false;
    S.lobbyPlayers = [{ id:'host', name:S.playerName, isHost:true, connected:true, peerId:'maf-'+code.toLowerCase() }];
    S.screen = 'lobby'; render();

    p.on('connection', conn=>{
      conn.on('open',()=>{
        S.conns[conn.peer]=conn;
        conn.on('data', msg=>hostOnMsg(conn,msg));
        conn.on('close',()=>{
          const pl=S.lobbyPlayers.find(x=>x.id===conn.peer);
          if(pl) pl.connected=false;
          delete S.conns[conn.peer];
          if(S.screen==='lobby') render();
        });
      });
    });
    p.on('call', call=>VOICE.answerCall(call));
  });
}

function doJoin() {
  const code = (document.getElementById('inp-code')?.value||'').trim().toUpperCase();
  if (!code||code.length<4){ S.error='Please enter a valid room code.'; render(); return; }
  S.roomCode=code; S.isHost=false; S.loading=true; S.error=''; render();
  if (S.peer){try{S.peer.destroy();}catch(e){}}

  makePeer(null, 0, (p, err)=>{
    if (!p){
      S.loading=false; S.error='Could not connect to game server. Check your internet and try again.'; S.screen='join'; render(); return;
    }
    S.peer=p; S.myId=p.id;
    const hostId='maf-'+code.toLowerCase();
    const conn=p.connect(hostId,{reliable:true});
    const ctid=setTimeout(()=>{
      if(S.loading){ S.loading=false; S.error='Could not connect — check the room code.'; S.screen='join'; render(); }
    },9000);
    conn.on('open',()=>{
      clearTimeout(ctid); S.loading=false; S.conn=conn;
      conn.send({type:'join',name:S.playerName,peerId:p.id});
      S.screen='lobby'; render();
    });
    conn.on('data', msg=>guestOnMsg(msg));
    conn.on('close',()=>{ if(S.phase!=='over'){S.error='Lost connection to host.';S.screen='join';S.loading=false;render();} });
    conn.on('error',()=>{ clearTimeout(ctid); S.error='Connection failed. Check the room code.'; S.loading=false; S.screen='join'; render(); });
    p.on('call', call=>VOICE.answerCall(call));
  });
}

function broadcast(msg){ Object.values(S.conns).forEach(c=>{try{c.send(msg);}catch(e){}}); }
function broadcastLobby(){ broadcast({type:'lobby',players:S.lobbyPlayers,settings:S.settings}); }

/* ══════════════════════════════════════════════
   HOST MESSAGE HANDLER
   ══════════════════════════════════════════════ */
function hostOnMsg(conn,msg){
  if(msg.type==='join'){
    const id=conn.peer;
    const ex=S.lobbyPlayers.find(p=>p.id===id);
    if(ex){ex.connected=true;ex.name=msg.name;ex.peerId=msg.peerId||id;}
    else S.lobbyPlayers.push({id,name:msg.name,isHost:false,connected:true,peerId:msg.peerId||id});
    // Tell everyone about the new peer
    const newPid=msg.peerId||id;
    Object.values(S.conns).forEach(c=>{if(c.peer!==id){try{c.send({type:'peer-joined',peerId:newPid});}catch(e){}}});
    // Tell new player about existing peers
    const existing=S.lobbyPlayers.filter(p=>p.id!==id&&p.peerId).map(p=>p.peerId);
    conn.send({type:'existing-peers',peers:existing});
    broadcastLobby(); render();
  }
  else if(msg.type==='role-seen'){ S._rolesReady++; checkAllRolesReady(); }
  else if(msg.type==='night-action'){ hostProcessAction(conn.peer,msg.actionType,msg.target); }
  else if(msg.type==='vote'){ hostProcessVote(conn.peer,msg.targetId); }
  else if(msg.type==='speaking'){ S.voiceSpeaking[msg.id]=msg.val; broadcast(msg); renderSpeakDots(); }
  else if(msg.type==='voice-ready'){ if(VOICE.stream&&msg.peerId) VOICE.callPeer(msg.peerId); }
}

function checkAllRolesReady(){ if(S._rolesReady>=S._totalPlayers){S._rolesReady=0;hostBeginNight();} }

/* ══════════════════════════════════════════════
   GUEST MESSAGE HANDLER
   ══════════════════════════════════════════════ */
function guestOnMsg(msg){
  if(msg.type==='lobby'){S.lobbyPlayers=msg.players;S.settings=msg.settings;S.screen='lobby';render();}
  else if(msg.type==='game-start'){S.myRole=msg.role;S.players=msg.players;S.phase='roleReveal';S.screen='game';transition(()=>render());}
  else if(msg.type==='night-begin'){S.nightNumber=msg.nightNumber;S.phase='night';S.narration='';S.loading=true;render();}
  else if(msg.type==='night-start'){S.phase='night';S.narration=msg.narration||'';S.loading=false;S.nightNumber=msg.nightNumber||S.nightNumber;S.nightActionType=null;S.nightActionResult=null;S.cupidPick=[];render();}
  else if(msg.type==='your-turn'){S.phase='nightAction';S.nightActionType=msg.actionType;S.nightActionTargets=msg.targets;S.nightActionResult=null;S.cupidPick=[];render();}
  else if(msg.type==='day-start'){S.phase='day';S.nightDead=msg.dead;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.nightNumber=msg.nightNumber;transition(()=>render());}
  else if(msg.type==='vote-start'){S.phase='vote';S.voteData={};S.players=msg.players;render();}
  else if(msg.type==='vote-update'){S.voteData=msg.voteData||S.voteData;render();}
  else if(msg.type==='vote-result'){S.phase='voteResult';S.votedOut=msg.eliminated;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.winner=msg.winner||null;render();}
  else if(msg.type==='game-over'){S.phase='over';S.winner=msg.winner;S.narration=msg.narration;S.loading=false;S.players=msg.players;S.screen='game';transition(()=>render());}
  else if(msg.type==='voice-global-mute'){S.voiceMutedByHost=msg.muted;VOICE.applyAll();updateVoiceBar();}
  else if(msg.type==='voice-muted-by-host'){S.voiceMutedByHost=msg.muted;VOICE.applyAll();updateVoiceBar();}
  else if(msg.type==='speaking'){S.voiceSpeaking[msg.id]=msg.val;renderSpeakDots();}
  else if(msg.type==='peer-joined'){if(VOICE.stream)VOICE.callPeer(msg.peerId);}
  else if(msg.type==='existing-peers'){if(VOICE.stream)msg.peers.forEach(pid=>{if(pid!==S.peer?.id)VOICE.callPeer(pid);});}
}

/* ══════════════════════════════════════════════
   GAME LOGIC (HOST)
   ══════════════════════════════════════════════ */
async function hostStartGame(){
  const pl=S.lobbyPlayers;
  if(pl.length<4){S.error='Need at least 4 players!';render();return;}
  const cfg=S.settings;
  const spec=cfg.mafia+cfg.doctor+cfg.detective+cfg.cupid+cfg.jester;
  if(spec>pl.length){S.error='Too many special roles for this player count!';render();return;}
  const roles=[];
  for(let i=0;i<cfg.mafia;i++)roles.push('Mafia');
  if(cfg.doctor)roles.push('Doctor');
  if(cfg.detective)roles.push('Detective');
  if(cfg.cupid)roles.push('Cupid');
  if(cfg.jester)roles.push('Jester');
  while(roles.length<pl.length)roles.push('Civilian');
  const shuffled=shuffle(roles);
  S.players=pl.map((p,i)=>({id:p.id,name:p.name,role:shuffled[i],alive:true}));
  S.lovers=[];S.nightNumber=1;S.nightActions={};
  S._totalPlayers=pl.length;S._rolesReady=0;
  if(VOICE.stream)VOICE.setGlobalMute(true);
  S.players.forEach(player=>{
    const vis=S.players.map(p=>({
      id:p.id,name:p.name,alive:p.alive,
      role:(p.id===player.id||(player.role==='Mafia'&&p.role==='Mafia'))?p.role:undefined
    }));
    if(player.id==='host'){S.myRole=player.role;S.screen='game';S.phase='roleReveal';}
    else S.conns[player.id]?.send({type:'game-start',role:player.role,players:vis});
  });
  transition(()=>render());
}

async function hostBeginNight(){
  S.nightActions={};S._nightQ=[];S.phase='night';S.loading=true;
  if(VOICE.stream)VOICE.setGlobalMute(true);
  render();
  broadcast({type:'night-begin',nightNumber:S.nightNumber});
  const t=await callGM(`Mafia Game Master. Night ${S.nightNumber} begins in a small town. One short atmospheric sentence about darkness falling.`);
  S.narration=t;S.loading=false;
  broadcast({type:'night-start',narration:t,nightNumber:S.nightNumber});
  render(); buildAndRunNightQueue();
}

function buildAndRunNightQueue(){
  const alive=S.players.filter(p=>p.alive);const q=[];
  if(S.nightNumber===1){const c=alive.find(p=>p.role==='Cupid');if(c)q.push(c);}
  const mafia=alive.filter(p=>p.role==='Mafia');if(mafia.length>0)q.push(mafia[0]);
  const doc=alive.find(p=>p.role==='Doctor');if(doc)q.push(doc);
  const det=alive.find(p=>p.role==='Detective');if(det)q.push(det);
  S._nightQ=[...q]; runNextNightActor();
}

function runNextNightActor(){
  if(!S._nightQ||S._nightQ.length===0){hostResolveNight();return;}
  const actor=S._nightQ.shift();S._curActor=actor;
  const alive=S.players.filter(p=>p.alive);const others=alive.filter(p=>p.id!==actor.id);
  let actionType='';let targets=[];
  if(actor.role==='Cupid'){actionType='cupid-link';targets=alive.map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Mafia'){actionType='mafia-kill';targets=others.filter(p=>p.role!=='Mafia').map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Doctor'){actionType='doctor-protect';targets=alive.map(p=>({id:p.id,name:p.name}));}
  else if(actor.role==='Detective'){actionType='detective-investigate';targets=others.map(p=>({id:p.id,name:p.name,isMafia:p.role==='Mafia'}));}
  if(actor.id==='host'){
    S.phase='nightAction';S.nightActionType=actionType;S.nightActionTargets=targets;S.nightActionResult=null;S.cupidPick=[];render();
  } else {
    S.conns[actor.id]?.send({type:'your-turn',actionType,targets});S.phase='night';render();
  }
}

function sendNightAction(actionType,target){
  if(S.isHost){hostProcessAction('host',actionType,target);S.phase='night';render();}
  else{S.conn.send({type:'night-action',actionType,target});S.phase='night';S.nightActionType=null;render();}
}

function hostProcessAction(actorId,actionType,target){
  if(actionType==='mafia-kill')S.nightActions.mafiaTarget=target;
  else if(actionType==='doctor-protect')S.nightActions.doctorTarget=target;
  else if(actionType==='detective-investigate')S.nightActions.detectiveTarget=target;
  else if(actionType==='cupid-link'){
    S.nightActions.cupidTargets=Array.isArray(target)?target:[target];
    S.lovers=S.nightActions.cupidTargets;
    S.players=S.players.map(p=>({...p,isLover:S.lovers.includes(p.id)}));
  }
  runNextNightActor();
}

async function hostResolveNight(){
  const na=S.nightActions;let dead=[];
  if(na.mafiaTarget&&na.mafiaTarget!==na.doctorTarget){
    const t=S.players.find(p=>p.id===na.mafiaTarget&&p.alive);if(t)dead.push(t);
  }
  const seen=new Set(dead.map(d=>d.id));let chg=true;
  while(chg){chg=false;[...dead].forEach(d=>{if(S.lovers.includes(d.id)){S.lovers.forEach(lid=>{if(lid!==d.id&&!seen.has(lid)){const p=S.players.find(x=>x.id===lid&&x.alive);if(p){dead.push(p);seen.add(lid);chg=true;}}});}});}
  const deadSet=new Set(dead.map(d=>d.id));
  S.players=S.players.map(p=>({...p,alive:deadSet.has(p.id)?false:p.alive}));
  S.nightDead=dead;S.nightActions={};S.loading=true;render();
  const w=checkWin(S.players);
  const prompt=dead.length===0
    ?`Mafia game narration. Night ${S.nightNumber}: the doctor saved someone. One eerie sentence about a peaceful dawn in a suspicious town.`
    :`Mafia game narration. Night ${S.nightNumber}: found dead at dawn: ${dead.map(d=>d.name).join(', ')}. Two atmospheric sentences for a town morning newspaper.`;
  const t=await callGM(prompt);S.narration=t;S.loading=false;
  if(w){await hostEndGame(w);return;}
  if(VOICE.stream)VOICE.setGlobalMute(false);
  const dayMsg={type:'day-start',dead:dead.map(d=>({id:d.id,name:d.name,role:d.role})),narration:t,players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive})),nightNumber:S.nightNumber};
  broadcast(dayMsg);S.phase='day';transition(()=>render());
}

function hostBeginVoting(){
  const alive=S.players.filter(p=>p.alive);
  S.voteData={};S._voteExpected=alive.length;
  broadcast({type:'vote-start',players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive}))});
  S.phase='vote';render();
}

function submitVote(targetId){
  const myId=S.myId||'host';
  const vv=targetId===null?'__abstain__':targetId;
  S.voteData[myId]=vv;render();
  if(S.isHost)hostProcessVote('host',targetId);
  else S.conn.send({type:'vote',targetId});
}

function hostProcessVote(voterId,targetId){
  const vv=targetId===null?'__abstain__':targetId;
  S.voteData[voterId]=vv;
  const alive=S.players.filter(p=>p.alive);
  const cast=alive.filter(p=>S.voteData.hasOwnProperty(p.id)).length;
  broadcast({type:'vote-update',voteData:S.voteData});
  if(cast>=alive.length) hostResolveVote();
  else render();
}

async function hostResolveVote(){
  const alive=S.players.filter(p=>p.alive);const counts={};
  alive.forEach(p=>{const v=S.voteData[p.id];if(v&&v!=='__abstain__')counts[v]=(counts[v]||0)+1;});
  const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  let elim=null;
  if(sorted.length>0&&(sorted.length===1||sorted[0][1]>sorted[1][1]))elim=S.players.find(p=>p.id===sorted[0][0]);
  if(elim){
    S.players=S.players.map(p=>({...p,alive:p.id===elim.id?false:p.alive}));
    if(S.lovers.includes(elim.id))S.lovers.forEach(lid=>{if(lid!==elim.id)S.players=S.players.map(p=>({...p,alive:p.id===lid?false:p.alive}));});
  }
  S.votedOut=elim||null;S.loading=true;render();
  const w=checkWin(S.players,elim);
  const t=await callGM(elim
    ?`Mafia town game. Day vote: the citizens eliminated ${elim.name}, who was ${elim.role}. Two dramatic sentences for a small-town newspaper.`
    :`Mafia town game. The citizens' vote was tied — no one eliminated. One tense sentence about unresolved suspicion.`);
  S.narration=t;S.loading=false;
  if(w){await hostEndGame(w);return;}
  broadcast({type:'vote-result',eliminated:elim?{id:elim.id,name:elim.name,role:elim.role}:null,narration:t,players:S.players.map(p=>({id:p.id,name:p.name,alive:p.alive})),winner:null});
  S.phase='voteResult';render();
}

async function hostEndGame(winner){
  S.winner=winner;S.loading=true;S.phase='over';
  if(VOICE.stream)VOICE.setGlobalMute(false);
  render();
  const t=await callGM(`Mafia town game ended. ${winner} won. Two climactic sentences fitting for a town newspaper's final edition.`);
  S.narration=t;S.loading=false;
  broadcast({type:'game-over',winner,narration:t,players:S.players});
  transition(()=>render());
}

/* ══════════════════════════════════════════════
   HELPERS
   ══════════════════════════════════════════════ */
function checkWin(ps,elim=null){
  if(elim?.role==='Jester')return'Jester';
  const aM=ps.filter(p=>p.alive&&p.role==='Mafia').length;
  const aT=ps.filter(p=>p.alive&&p.role!=='Mafia'&&p.role!=='Jester').length;
  if(aM===0)return'Town';if(aM>=aT)return'Mafia';return null;
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

async function callGM(prompt){
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:200,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();
    if(d.content&&d.content[0]?.text)return d.content[0].text;
    return 'The town waits in uneasy silence…';
  }catch{return'The town waits in uneasy silence…';}
}

function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}

/* ══════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════ */
const urlRoom = new URLSearchParams(location.search).get('room');
if (urlRoom){ S.roomCode=urlRoom.toUpperCase(); S.screen='name'; }
render();
</script>
